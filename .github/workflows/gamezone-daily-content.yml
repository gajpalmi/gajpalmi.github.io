name: GAMEZONE ARENA Daily Hindi Content

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Hindi content with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          async function main() {
            const apiKey = process.env.GEMINI_API_KEY;

            if (!apiKey) {
              console.error("GEMINI_API_KEY secret is missing.");
              process.exit(1);
            }

            const model = "gemini-3.5-flash-lite";

            const url =
              `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;

            const prompt = `
          You are the automatic Hindi content editor for the GAMEZONE ARENA website.

          IMPORTANT LANGUAGE RULE:
          Generate ALL user-facing content in natural, easy-to-read Hindi using Devanagari script.

          English may be used only for:
          - necessary technical product names
          - brand names
          - app names
          - website names
          - common technology terms when Hindi would be unnatural

          Do NOT generate the main content in English.

          Generate 18 fresh and original website content items.

          The content must be useful, entertaining, family-friendly and suitable for a public Indian website.

          IMPORTANT CURRENT-TOPIC RULE:
          When generating news, trends, technology updates, mobile updates, AI updates,
          internet topics, apps, games, entertainment updates or other time-sensitive topics,
          use Google Search grounding to identify current/recent topics.

          Do not invent current news.
          Do not present old information as today's news.
          Do not make unsupported claims.

          For evergreen topics such as jokes, shayari, devotional content and general knowledge,
          Google Search is not required unless needed for factual accuracy.

          IMPORTANT:
          Do not copy articles, jokes, poems or other copyrighted text.
          Write original content.

          Do not use Markdown inside the generated content.

          Return ONLY valid JSON.

          Allowed content types:

          jokes
          shayari
          bhakti
          knowledge
          news
          technology
          mobile
          gaming
          entertainment
          dialogue
          internet
          ai
          tips
          blog

          Suggested categories:

          jokes:
          Funny, Desi, Family, Friendship, School, Office

          shayari:
          Love, Friendship, Life, Motivational, Emotional

          bhakti:
          Prayer, Devotional, Spiritual, Festival, Motivation

          knowledge:
          Science, India, Space, Animals, History, General Knowledge

          news:
          India, World, Technology, Sports, Entertainment, Trending

          technology:
          Technology, AI, Internet, Apps, Gadgets, Cyber Safety

          mobile:
          Android, Mobile Tips, Apps, Smartphones, Settings, Security

          gaming:
          Games, Gaming Tips, Esports, Mobile Gaming, Ludo, Cricket

          entertainment:
          Movies, Music, Web Series, Games, Fun, Celebrity News

          dialogue:
          Funny, Family, Friendship, Desi, Gaming, Motivational

          internet:
          Internet Tips, Social Media, Websites, Online Safety, Search

          ai:
          AI Tools, AI News, AI Tips, Productivity, Technology

          tips:
          Mobile Tips, Internet Tips, Gaming Tips, Daily Life, Technology

          blog:
          Gaming, Technology, Mobile, AI, Lifestyle, Internet, How-To

          Generate a balanced mixture of these types.

          Include current/recent topics where appropriate.

          Every item must contain exactly these fields:

          type
          title
          category
          content
          sourceNote

          sourceNote rules:
          - For current/news/trending/search-grounded content, briefly mention the source/topic used.
          - For jokes, shayari, bhakti, dialogue and evergreen original content, use:
            "मौलिक सामग्री"
          - Do not put URLs inside sourceNote.

          Content quality rules:

          1. Titles must be short and interesting.
          2. Content must be easy Hindi.
          3. Avoid unnecessary English.
          4. Avoid fake breaking-news claims.
          5. Avoid political persuasion.
          6. Avoid hate, adult content and dangerous instructions.
          7. Avoid medical misinformation.
          8. Avoid financial promises or guaranteed earning claims.
          9. Do not invent quotes from famous people.
          10. Make every item substantially different.
          11. Do not repeat the same joke or idea.
          12. Make technology and mobile content genuinely useful.
          13. Make blog content informative and readable.
          14. Make knowledge content factually careful.
          15. For current topics, clearly use recent information obtained through search grounding.

          The website audience is primarily Indian users.

          Generate exactly 18 items.
          `;

            const response = await fetch(url, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "x-goog-api-key": apiKey
              },
              body: JSON.stringify({
                contents: [
                  {
                    parts: [
                      {
                        text: prompt
                      }
                    ]
                  }
                ],

                tools: [
                  {
                    google_search: {}
                  }
                ],

                generationConfig: {
                  response_mime_type: "application/json",

                  response_schema: {
                    type: "array",

                    items: {
                      type: "object",

                      properties: {
                        type: {
                          type: "string"
                        },

                        title: {
                          type: "string"
                        },

                        category: {
                          type: "string"
                        },

                        content: {
                          type: "string"
                        },

                        sourceNote: {
                          type: "string"
                        }
                      },

                      required: [
                        "type",
                        "title",
                        "category",
                        "content",
                        "sourceNote"
                      ]
                    }
                  }
                }
              })
            });

            const result = await response.json();

            if (!response.ok) {
              console.error("Gemini API request failed:");
              console.error(JSON.stringify(result, null, 2));
              process.exit(1);
            }

            const text =
              result?.candidates?.[0]?.content?.parts?.[0]?.text;

            if (!text) {
              console.error("Gemini returned no content.");
              console.error(JSON.stringify(result, null, 2));
              process.exit(1);
            }

            let items;

            try {
              items = JSON.parse(text);
            } catch (error) {
              console.error("Gemini returned invalid JSON.");
              console.error(text);
              process.exit(1);
            }

            if (!Array.isArray(items)) {
              console.error("Gemini response is not an array.");
              process.exit(1);
            }

            const allowedTypes = new Set([
              "jokes",
              "shayari",
              "bhakti",
              "knowledge",
              "news",
              "technology",
              "mobile",
              "gaming",
              "entertainment",
              "dialogue",
              "internet",
              "ai",
              "tips",
              "blog"
            ]);

            const cleanItems = items
              .filter(item =>
                item &&
                allowedTypes.has(item.type) &&
                typeof item.title === "string" &&
                typeof item.category === "string" &&
                typeof item.content === "string" &&
                typeof item.sourceNote === "string"
              )
              .map(item => ({
                type: item.type.trim(),
                title: item.title.trim(),
                category: item.category.trim(),
                content: item.content.trim(),
                sourceNote: item.sourceNote.trim(),
                generatedAt: new Date().toISOString()
              }))
              .filter(item =>
                item.title &&
                item.content
              );

            if (cleanItems.length === 0) {
              console.error("No valid content was generated.");
              process.exit(1);
            }

            const file = "content/auto-content.json";

            fs.mkdirSync("content", {
              recursive: true
            });

            let existing = [];

            if (fs.existsSync(file)) {
              try {
                const raw = fs.readFileSync(
                  file,
                  "utf8"
                );

                if (raw.trim()) {
                  const parsed = JSON.parse(raw);

                  if (Array.isArray(parsed)) {
                    existing = parsed;
                  }
                }
              } catch (error) {
                console.log(
                  "Could not read existing content. Starting with empty list."
                );
              }
            }

            const finalContent = [
              ...existing,
              ...cleanItems
            ];

            fs.writeFileSync(
              file,
              JSON.stringify(
                finalContent,
                null,
                2
              ),
              "utf8"
            );

            console.log(
              `Added ${cleanItems.length} Hindi items. Total: ${finalContent.length}`
            );
          }

          main().catch(error => {
            console.error("Workflow script failed:");
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit generated content
        run: |
          git config user.name "GAMEZONE ARENA Auto Content"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/auto-content.json

          if git diff --cached --quiet; then
            echo "No content changes to commit."
            exit 0
          fi

          git commit -m "Generate daily Hindi GAMEZONE ARENA content"
          git push
