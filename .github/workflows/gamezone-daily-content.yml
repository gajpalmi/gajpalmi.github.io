name: GAMEZONE ARENA Daily Hindi Content

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Hindi content with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          async function getCurrentNews() {
            const rssUrl =
              "https://news.google.com/rss?hl=hi&gl=IN&ceid=IN:hi";

            try {
              const response = await fetch(rssUrl);

              if (!response.ok) {
                console.log("News RSS unavailable.");
                return "";
              }

              const xml = await response.text();

              const titles = [
                ...xml.matchAll(/<title>(.*?)<\/title>/g)
              ]
                .map(match =>
                  match[1]
                    .replace(/<!\[CDATA\[(.*?)\]\]>/g, "$1")
                    .replace(/&amp;/g, "&")
                    .replace(/&quot;/g, '"')
                    .replace(/&#39;/g, "'")
                    .replace(/&lt;/g, "<")
                    .replace(/&gt;/g, ">")
                    .trim()
                )
                .filter(title =>
                  title &&
                  title !== "Google News"
                )
                .slice(0, 15);

              return titles.join("\n");
            } catch (error) {
              console.log(
                "Could not load current news:",
                error.message
              );

              return "";
            }
          }

          async function main() {
            const apiKey = process.env.GEMINI_API_KEY;

            if (!apiKey) {
              console.error(
                "GEMINI_API_KEY secret is missing."
              );
              process.exit(1);
            }

            const currentNews =
              await getCurrentNews();

            const model =
              "gemini-3.5-flash-lite";

            const url =
              `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;

            const prompt = `
          आप GAMEZONE ARENA वेबसाइट के लिए हिंदी में
          रोज़ नया और मौलिक content तैयार करने वाले
          automatic content editor हैं।

          बहुत महत्वपूर्ण:

          सभी user-facing content मुख्य रूप से
          हिंदी देवनागरी लिपि में होना चाहिए।

          जरूरत पड़ने पर केवल brand name,
          app name, website name, mobile model,
          technology term या सामान्य technical शब्द
          English में रह सकते हैं।

          मुख्य content English में नहीं होना चाहिए।

          आज वेबसाइट के लिए 18 नए content items बनाइए।

          CONTENT TYPES:

          jokes
          shayari
          bhakti
          knowledge
          news
          technology
          mobile
          gaming
          entertainment
          dialogue
          internet
          ai
          tips
          blog

          CATEGORIES:

          jokes:
          Funny, Desi, Family, Friendship, School, Office

          shayari:
          Love, Friendship, Life, Motivational, Emotional

          bhakti:
          Prayer, Devotional, Spiritual, Festival, Motivation

          knowledge:
          Science, India, Space, Animals, History, General Knowledge

          news:
          India, World, Technology, Sports, Entertainment, Trending

          technology:
          Technology, AI, Internet, Apps, Gadgets, Cyber Safety

          mobile:
          Android, Mobile Tips, Apps, Smartphones, Settings, Security

          gaming:
          Games, Gaming Tips, Esports, Mobile Gaming, Ludo, Cricket

          entertainment:
          Movies, Music, Web Series, Games, Fun, Celebrity News

          dialogue:
          Funny, Family, Friendship, Desi, Gaming, Motivational

          internet:
          Internet Tips, Social Media, Websites, Online Safety, Search

          ai:
          AI Tools, AI News, AI Tips, Productivity, Technology

          tips:
          Mobile Tips, Internet Tips, Gaming Tips, Daily Life, Technology

          blog:
          Gaming, Technology, Mobile, AI, Lifestyle, Internet, How-To

          CONTENT RULES:

          1. सभी content मौलिक होना चाहिए।

          2. पुराने content को copy मत करें।

          3. एक ही joke या idea दोबारा मत लिखें।

          4. Family-friendly content रखें।

          5. आसान और स्वाभाविक हिंदी लिखें।

          6. Mobile, Android, Apps, AI, Internet,
             Gaming और Technology पर उपयोगी जानकारी दें।

          7. Blog items थोड़े विस्तार से और उपयोगी हों।

          8. Knowledge items तथ्यात्मक और सावधानी से लिखें।

          9. Fake news मत बनाएं।

          10. किसी प्रसिद्ध व्यक्ति का fake quote मत बनाएं।

          11. राजनीतिक persuasion मत करें।

          12. स्वास्थ्य, पैसे या investment के बारे में
              झूठे या guaranteed claims मत करें।

          13. Current news को अपनी तरफ से invent मत करें।

          14. नीचे दिए गए CURRENT NEWS HEADLINES को
              केवल current-topic context के रूप में इस्तेमाल करें।

          15. अगर किसी headline की जानकारी पर्याप्त नहीं है,
              तो उसके बारे में fake details मत जोड़ें।

          CURRENT NEWS HEADLINES:

          ${currentNews || "आज कोई current headline उपलब्ध नहीं है।"}

          IMPORTANT:

          यदि current news headlines उपलब्ध हैं,
          तो कुछ news/trending/technology/mobile/AI items
          उनसे संबंधित बनाए जा सकते हैं।

          लेकिन headline में उपलब्ध जानकारी से आगे
          कोई तथ्य invent नहीं करना है।

          बाकी items evergreen original content हो सकते हैं।

          हर item में exactly ये fields होनी चाहिए:

          type
          title
          category
          content
          sourceNote

          sourceNote rules:

          Current/news items:
          "Google News headlines से topic लिया गया"

          Original jokes/shayari/bhakti/dialogue:
          "मौलिक सामग्री"

          Evergreen knowledge/tips/blog:
          "मौलिक सामग्री"

          URLs sourceNote में मत डालें।

          Markdown मत इस्तेमाल करें।

          Exactly 18 items बनाइए।

          सभी items अलग-अलग होने चाहिए।

          JSON के अलावा कोई text वापस मत दें।
          `;

            const response = await fetch(url, {
              method: "POST",

              headers: {
                "Content-Type": "application/json",
                "x-goog-api-key": apiKey
              },

              body: JSON.stringify({
                contents: [
                  {
                    parts: [
                      {
                        text: prompt
                      }
                    ]
                  }
                ],

                generationConfig: {
                  response_mime_type:
                    "application/json",

                  response_schema: {
                    type: "array",

                    items: {
                      type: "object",

                      properties: {
                        type: {
                          type: "string"
                        },

                        title: {
                          type: "string"
                        },

                        category: {
                          type: "string"
                        },

                        content: {
                          type: "string"
                        },

                        sourceNote: {
                          type: "string"
                        }
                      },

                      required: [
                        "type",
                        "title",
                        "category",
                        "content",
                        "sourceNote"
                      ]
                    }
                  }
                }
              })
            });

            const result =
              await response.json();

            if (!response.ok) {
              console.error(
                "Gemini API request failed:"
              );

              console.error(
                JSON.stringify(
                  result,
                  null,
                  2
                )
              );

              process.exit(1);
            }

            const text =
              result
                ?.candidates?.[0]
                ?.content?.parts?.[0]
                ?.text;

            if (!text) {
              console.error(
                "Gemini returned no content."
              );

              console.error(
                JSON.stringify(
                  result,
                  null,
                  2
                )
              );

              process.exit(1);
            }

            let items;

            try {
              items = JSON.parse(text);
            } catch (error) {
              console.error(
                "Gemini returned invalid JSON."
              );

              console.error(text);

              process.exit(1);
            }

            if (!Array.isArray(items)) {
              console.error(
                "Gemini response is not an array."
              );

              process.exit(1);
            }

            const allowedTypes =
              new Set([
                "jokes",
                "shayari",
                "bhakti",
                "knowledge",
                "news",
                "technology",
                "mobile",
                "gaming",
                "entertainment",
                "dialogue",
                "internet",
                "ai",
                "tips",
                "blog"
              ]);

            const cleanItems =
              items
                .filter(item =>
                  item &&
                  allowedTypes.has(
                    item.type
                  ) &&
                  typeof item.title ===
                    "string" &&
                  typeof item.category ===
                    "string" &&
                  typeof item.content ===
                    "string" &&
                  typeof item.sourceNote ===
                    "string"
                )

                .map(item => ({
                  type:
                    item.type.trim(),

                  title:
                    item.title.trim(),

                  category:
                    item.category.trim(),

                  content:
                    item.content.trim(),

                  sourceNote:
                    item.sourceNote.trim(),

                  generatedAt:
                    new Date()
                      .toISOString()
                }))

                .filter(item =>
                  item.title &&
                  item.content
                );

            if (
              cleanItems.length === 0
            ) {
              console.error(
                "No valid content was generated."
              );

              process.exit(1);
            }

            const file =
              "content/auto-content.json";

            fs.mkdirSync(
              "content",
              {
                recursive: true
              }
            );

            let existing = [];

            if (
              fs.existsSync(file)
            ) {
              try {
                const raw =
                  fs.readFileSync(
                    file,
                    "utf8"
                  );

                if (raw.trim()) {
                  const parsed =
                    JSON.parse(raw);

                  if (
                    Array.isArray(
                      parsed
                    )
                  ) {
                    existing =
                      parsed;
                  }
                }
              } catch (error) {
                console.log(
                  "Could not read existing content."
                );
              }
            }

            const finalContent = [
              ...existing,
              ...cleanItems
            ];

            fs.writeFileSync(
              file,

              JSON.stringify(
                finalContent,
                null,
                2
              ),

              "utf8"
            );

            console.log(
              `Added ${cleanItems.length} Hindi items. Total: ${finalContent.length}`
            );
          }

          main().catch(error => {
            console.error(
              "Workflow script failed:"
            );

            console.error(error);

            process.exit(1);
          });
          NODE

      - name: Commit generated content
        run: |
          git config user.name "GAMEZONE ARENA Auto Content"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/auto-content.json

          if git diff --cached --quiet; then
            echo "No content changes to commit."
            exit 0
          fi

          git commit -m "Generate daily Hindi GAMEZONE ARENA content"

          git push
