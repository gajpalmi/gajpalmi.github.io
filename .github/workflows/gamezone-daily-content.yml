name: GAMEZONE ARENA Daily Hindi Content

"on":
  workflow_dispatch:

  schedule:
    - cron: "45 3 * * *"

permissions:
  contents: write

concurrency:
  group: gamezone-arena-daily-content
  cancel-in-progress: false

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate complete Hindi content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > /tmp/gamezone-content.mjs <<'EOF'
          import fs from "fs";

          const API_KEY = process.env.GEMINI_API_KEY;

          if (!API_KEY) {
            console.error("ERROR: GEMINI_API_KEY secret is missing.");
            process.exit(1);
          }

          const MODEL = "gemini-3.5-flash-lite";

          const API_URL =
            `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`;

          const NEWS_URL =
            "https://news.google.com/rss?hl=hi&gl=IN&ceid=IN:hi";

          const CONTENT_FILE =
            "content/auto-content.json";

          const LOG_DIR =
            "content/logs";

          const TARGET_ITEMS = 20;
          const MAX_STORED_ITEMS = 300;
          const MAX_NEWS_TOPICS = 15;

          function cleanText(value) {
            return String(value || "")
              .replace(/<!\[CDATA\[([\s\S]*?)\]\]>/gi, "$1")
              .replace(/<br\s*\/?>/gi, " ")
              .replace(/<[^>]*>/g, " ")
              .replace(/&amp;/gi, "&")
              .replace(/&quot;/gi, '"')
              .replace(/&#39;/gi, "'")
              .replace(/&apos;/gi, "'")
              .replace(/&lt;/gi, "<")
              .replace(/&gt;/gi, ">")
              .replace(/&#(\d+);/g, (_, n) => {
                try {
                  return String.fromCodePoint(Number(n));
                } catch {
                  return "";
                }
              })
              .replace(/&#x([0-9a-f]+);/gi, (_, n) => {
                try {
                  return String.fromCodePoint(parseInt(n, 16));
                } catch {
                  return "";
                }
              })
              .replace(/\s+/g, " ")
              .trim();
          }

          function metaDescription(text) {
            return cleanText(text).slice(0, 155);
          }

          function normalizeType(value) {
            const raw = cleanText(value).toLowerCase();

            const aliases = {
              joke: "jokes",
              jokes: "jokes",

              shayari: "shayari",
              poetry: "shayari",
              poem: "shayari",

              suvichar: "suvichar",
              "su vichar": "suvichar",

              motivation: "motivation",
              motivational: "motivation",

              dialogue: "dialogue",
              dialogues: "dialogue",

              bhakti: "bhakti",
              devotional: "bhakti",
              spiritual: "bhakti",

              bhajan: "bhajan",
              bhajans: "bhajan",

              kirtan: "kirtan",
              kirtans: "kirtan",

              knowledge: "knowledge",
              gk: "knowledge",

              news: "news",

              technology: "technology",
              tech: "technology",

              mobile: "mobile",
              android: "mobile",

              internet: "internet",

              ai: "ai",

              google: "google",

              app: "apps",
              apps: "apps",

              gadget: "gadgets",
              gadgets: "gadgets",

              gaming: "gaming",
              game: "gaming",
              ludo: "gaming",

              entertainment: "entertainment",

              tips: "tips",
              tip: "tips",
              howto: "tips",
              "how-to": "tips",

              blog: "blog",
              blogs: "blog",

              seo: "seo",

              website: "website",

              trending: "trends",
              trends: "trends",

              "cricket gaming": "gaming"
            };

            return aliases[raw] || "blog";
          }

          function normalizeUrl(value) {
            const url = String(value || "").trim();

            if (/^https?:\/\/[^\s]+$/i.test(url)) {
              return url;
            }

            return "";
          }

          function normalizeKeywords(value) {
            if (!Array.isArray(value)) {
              return [];
            }

            const result = [];

            for (const item of value) {
              const keyword = cleanText(item);

              if (!keyword) {
                continue;
              }

              if (!result.includes(keyword)) {
                result.push(keyword);
              }

              if (result.length >= 8) {
                break;
              }
            }

            return result;
          }

          async function getCurrentNews() {
            console.log("Getting current Google News India...");

            try {
              const response = await fetch(NEWS_URL, {
                headers: {
                  "User-Agent":
                    "GAMEZONE-ARENA-Auto-Content/1.0"
                }
              });

              if (!response.ok) {
                console.log(
                  `Google News RSS unavailable: HTTP ${response.status}`
                );

                return [];
              }

              const xml = await response.text();

              if (!xml) {
                return [];
              }

              const items = [];

              for (
                const match of xml.matchAll(
                  /<item>([\s\S]*?)<\/item>/gi
                )
              ) {
                const block = match[1];

                const titleMatch =
                  block.match(
                    /<title>([\s\S]*?)<\/title>/i
                  );

                const descriptionMatch =
                  block.match(
                    /<description>([\s\S]*?)<\/description>/i
                  );

                const linkMatch =
                  block.match(
                    /<link>([\s\S]*?)<\/link>/i
                  );

                const dateMatch =
                  block.match(
                    /<pubDate>([\s\S]*?)<\/pubDate>/i
                  );

                const title =
                  cleanText(titleMatch?.[1] || "");

                const description =
                  cleanText(descriptionMatch?.[1] || "");

                const link =
                  cleanText(linkMatch?.[1] || "");

                const published =
                  cleanText(dateMatch?.[1] || "");

                if (!title) {
                  continue;
                }

                const duplicate =
                  items.some(
                    item =>
                      item.title.toLowerCase() ===
                      title.toLowerCase()
                  );

                if (duplicate) {
                  continue;
                }

                items.push({
                  title,
                  description,
                  link,
                  published
                });

                if (
                  items.length >=
                  MAX_NEWS_TOPICS
                ) {
                  break;
                }
              }

              console.log(
                `Current news topics found: ${items.length}`
              );

              return items;
            } catch (error) {
              console.log(
                "Google News RSS could not be loaded."
              );

              console.log(
                error?.message || error
              );

              return [];
            }
          }

          function makeNewsContext(news) {
            if (!news.length) {
              return `
आज Google News RSS उपलब्ध नहीं है।

इस स्थिति में current news या trending घटना
invent नहीं करनी है।

बाकी original evergreen content बनाएं।
`;
            }

            return news
              .map(
                (item, index) => `
NEWS ${index + 1}
Title: ${item.title}
Description: ${
                  item.description ||
                  "उपलब्ध नहीं"
                }
Source URL: ${
                  item.link ||
                  "उपलब्ध नहीं"
                }
Published: ${
                  item.published ||
                  "उपलब्ध नहीं"
                }
`
              )
              .join("\n");
          }

          function buildPrompt(news) {
            const newsContext =
              makeNewsContext(news);

            return `
आप GAMEZONE ARENA वेबसाइट के लिए रोज नई,
मौलिक, उपयोगी, family-friendly और पढ़ने योग्य
हिंदी सामग्री तैयार करने वाले professional
automatic editor हैं।

EXACTLY ${TARGET_ITEMS} अलग-अलग items बनाइए।

हर item COMPLETE होना चाहिए।

सिर्फ headline, आधा article, अधूरा paragraph,
placeholder या "Read More" के लिए अधूरा text
नहीं देना है।

हर item का content field अपने आप में पूरा
पढ़ने योग्य content होना चाहिए।

सभी user-facing content मुख्य रूप से सरल
हिंदी देवनागरी में होना चाहिए।

जरूरी technical terms English में रह सकते हैं।

==================================================
CURRENT GOOGLE NEWS INDIA
==================================================

${newsContext}

ऊपर की news केवल current topics समझने के
लिए है।

जो जानकारी source में उपलब्ध नहीं है उसे
invent मत करें।

==================================================
CONTENT VARIETY
==================================================

20 items में अच्छी variety रखें।

इन categories को मिलाकर content बनाएं:

- हिंदी चुटकुले
- मजेदार संवाद
- सुविचार
- मोटिवेशन
- प्रेम शायरी
- दोस्ती शायरी
- जीवन शायरी
- भक्ति
- भजन
- कीर्तन
- आध्यात्मिक जानकारी
- ज्ञान
- सामान्य ज्ञान
- Current News
- Current Trends
- Mobile
- Android
- Internet
- Online Safety
- AI
- Google
- Technology
- Apps
- Gadgets
- Gaming
- Ludo
- Cricket Gaming
- Gaming Tips
- Blogging
- SEO
- Website
- How-To
- Entertainment
- Internet पर लोगों के काम आने वाले नए
  और उपयोगी विषय

एक ही category के बहुत सारे items नहीं।

हर item का idea अलग हो।

==================================================
CONTENT COMPLETENESS
==================================================

Jokes:
80-160 शब्द।

Dialogue:
100-200 शब्द।

Shayari:
original और पूरी हो।

Suvichar/Motivation:
पूरा छोटा article या explanation दें।

Bhakti:
150-350 शब्द।

Bhajan/Kirtan:
original devotional content दें।

Copyrighted भजन के पूरे lyrics copy मत करें।

Knowledge/GK:
220-400 शब्द।

Mobile/Android/Internet/AI/Technology:
250-500 शब्द।

Gaming/Ludo/Cricket Gaming:
250-500 शब्द।

Blog/SEO/Website/How-To:
300-600 शब्द।

Current News:
उपलब्ध source information के अनुसार
पूरा लेकिन factual summary दें।

==================================================
NEWS RULES
==================================================

Current news में:

- केवल उपलब्ध RSS information का उपयोग करें।
- unsupported facts नहीं।
- नाम invent नहीं।
- आंकड़े invent नहीं।
- तारीख invent नहीं।
- location invent नहीं।
- आरोप invent नहीं।
- quotes invent नहीं।
- headline से आगे अनुमान को fact की तरह
  नहीं लिखना।
- source information कम हो तो साफ बताना।
- पूरा external article copy नहीं करना।

News original Hindi summary/explanation हो।

==================================================
POLITICAL SAFETY
==================================================

अगर current news में politics आती है तो:

- केवल neutral factual भाषा।
- किसी party या candidate के पक्ष में
  persuasion नहीं।
- किसी party या candidate के खिलाफ
  persuasion नहीं।
- campaign language नहीं।
- winner/best/worst घोषित नहीं करना।
- ranking या score नहीं देना।
- motive या intent speculate नहीं करना।
- health, intelligence या fitness पर
  speculation नहीं करना।

==================================================
ORIGINAL CONTENT
==================================================

Jokes original हों।

Shayari original हो।

Dialogues original हों।

Suvichar original हों।

Bhakti content respectful और original हो।

Bhajan/Kirtan में copyrighted lyrics
copy नहीं करने हैं।

किसी प्रसिद्ध व्यक्ति के नाम से fake quote
नहीं बनाना है।

Knowledge में गलत facts नहीं लिखना है।

Family-friendly content रखें।

==================================================
HEALTH / FINANCE
==================================================

Health या finance topic आने पर:

- dangerous medical advice नहीं।
- diagnosis नहीं।
- guaranteed cure नहीं।
- guaranteed income नहीं।
- guaranteed investment return नहीं।
- unsafe treatment नहीं।

General educational information ही दें।

==================================================
SEO
==================================================

हर item में:

type
title
category
content
keywords
seoTitle
metaDescription
sourceNote
sourceUrl

जरूर दें।

keywords:
3 से 8 keywords।

seoTitle:
natural और readable।

metaDescription:
160 characters से कम।

==================================================
SOURCE
==================================================

Current news/trending:

Google News India के current topic से प्रेरित

Original content:

मौलिक सामग्री

==================================================
TYPE VALUES
==================================================

इनमें से suitable type चुनें:

jokes
shayari
suvichar
motivation
dialogue
bhakti
bhajan
kirtan
knowledge
news
trends
mobile
internet
ai
google
technology
apps
gadgets
gaming
entertainment
tips
blog
seo
website

==================================================
FINAL REQUIREMENT
==================================================

EXACTLY ${TARGET_ITEMS} items।

हर item complete होना चाहिए।

किसी item में:

"Read More के लिए बाकी पढ़ें"

"आगे की जानकारी..."

"यह एक संक्षिप्त जानकारी है"

जैसा अधूरा placeholder नहीं होना चाहिए।

पूरा content content field में ही देना है।

JSON के अलावा कोई text नहीं।

Markdown नहीं।

==================================================
OUTPUT
==================================================

{
  "items": [
    {
      "type": "news",
      "title": "पूरा शीर्षक",
      "category": "India",
      "content": "पूरा और पढ़ने योग्य content",
      "keywords": [
        "हिंदी न्यूज़",
        "आज की खबर",
        "current news"
      ],
      "seoTitle": "पूरा SEO title",
      "metaDescription": "पूरी SEO description",
      "sourceNote": "Google News India के current topic से प्रेरित",
      "sourceUrl": "https://example.com"
    }
  ]
}
`;
          }

          async function callGemini(news) {
            const prompt =
              buildPrompt(news);

            const body = {
              contents: [
                {
                  parts: [
                    {
                      text: prompt
                    }
                  ]
                }
              ],

              generationConfig: {
                temperature: 0.75,

                responseMimeType:
                  "application/json",

                responseSchema: {
                  type: "OBJECT",

                  properties: {
                    items: {
                      type: "ARRAY",

                      items: {
                        type: "OBJECT",

                        properties: {
                          type: {
                            type: "STRING"
                          },

                          title: {
                            type: "STRING"
                          },

                          category: {
                            type: "STRING"
                          },

                          content: {
                            type: "STRING"
                          },

                          keywords: {
                            type: "ARRAY",

                            items: {
                              type: "STRING"
                            }
                          },

                          seoTitle: {
                            type: "STRING"
                          },

                          metaDescription: {
                            type: "STRING"
                          },

                          sourceNote: {
                            type: "STRING"
                          },

                          sourceUrl: {
                            type: "STRING"
                          }
                        },

                        required: [
                          "type",
                          "title",
                          "category",
                          "content",
                          "keywords",
                          "seoTitle",
                          "metaDescription",
                          "sourceNote",
                          "sourceUrl"
                        ]
                      }
                    }
                  },

                  required: [
                    "items"
                  ]
                }
              }
            };

            console.log(
              "Sending complete content request to Gemini..."
            );

            const response =
              await fetch(
                API_URL,
                {
                  method: "POST",

                  headers: {
                    "Content-Type":
                      "application/json",

                    "x-goog-api-key":
                      API_KEY
                  },

                  body:
                    JSON.stringify(body)
                }
              );

            const result =
              await response.json();

            if (!response.ok) {
              console.error(
                "Gemini API error:"
              );

              console.error(
                JSON.stringify(
                  result,
                  null,
                  2
                )
              );

              process.exit(1);
            }

            const text =
              result
                ?.candidates?.[0]
                ?.content?.parts?.[0]
                ?.text;

            if (!text) {
              console.error(
                "Gemini returned no content."
              );

              console.error(
                JSON.stringify(
                  result,
                  null,
                  2
                )
              );

              process.exit(1);
            }

            let parsed;

            try {
              parsed =
                JSON.parse(text);
            } catch (error) {
              console.error(
                "Gemini returned invalid JSON."
              );

              console.error(text);

              process.exit(1);
            }

            if (
              !parsed ||
              !Array.isArray(
                parsed.items
              )
            ) {
              console.error(
                "Gemini response does not contain items."
              );

              process.exit(1);
            }

            return parsed.items;
          }

          function normalizeItem(
            item,
            index,
            generatedAt
          ) {
            if (
              !item ||
              typeof item !== "object"
            ) {
              return null;
            }

            const title =
              cleanText(
                item.title
              );

            const content =
              cleanText(
                item.content
              );

            if (
              !title ||
              !content
            ) {
              return null;
            }

            const type =
              normalizeType(
                item.type
              );

            const category =
              cleanText(
                item.category
              ) ||
              "General";

            const keywords =
              normalizeKeywords(
                item.keywords
              );

            const seoTitle =
              cleanText(
                item.seoTitle
              ) ||
              title;

            const description =
              cleanText(
                item.metaDescription
              ) ||
              metaDescription(
                content
              );

            let sourceNote =
              cleanText(
                item.sourceNote
              );

            if (!sourceNote) {
              sourceNote =
                type === "news" ||
                type === "trends"
                  ? "Google News India के current topic से प्रेरित"
                  : "मौलिक सामग्री";
            }

            const sourceUrl =
              normalizeUrl(
                item.sourceUrl
              );

            return {
              type,
              title,
              category,
              content,
              keywords,
              seoTitle,
              metaDescription:
                description.slice(
                  0,
                  160
                ),
              sourceNote,
              sourceUrl,
              generatedAt,
              contentId:
                `${Date.now()}-${index}`
            };
          }

          function readExisting() {
            if (
              !fs.existsSync(
                CONTENT_FILE
              )
            ) {
              return [];
            }

            try {
              const raw =
                fs.readFileSync(
                  CONTENT_FILE,
                  "utf8"
                );

              if (!raw.trim()) {
                return [];
              }

              const parsed =
                JSON.parse(raw);

              if (
                Array.isArray(
                  parsed
                )
              ) {
                return parsed;
              }

              if (
                parsed &&
                Array.isArray(
                  parsed.items
                )
              ) {
                return parsed.items;
              }

              return [];
            } catch (error) {
              console.log(
                "Existing content could not be parsed."
              );

              return [];
            }
          }

          function uniqueByTitle(items) {
            const seen =
              new Set();

            const result = [];

            for (
              const item of items
            ) {
              const key =
                cleanText(
                  item.title
                )
                  .toLowerCase()
                  .replace(
                    /\s+/g,
                    " "
                  )
                  .trim();

              if (!key) {
                continue;
              }

              if (
                seen.has(key)
              ) {
                continue;
              }

              seen.add(key);

              result.push(item);
            }

            return result;
          }

          async function main() {
            console.log("");
            console.log(
              "=============================================="
            );
            console.log(
              "GAMEZONE ARENA DAILY HINDI CONTENT"
            );
            console.log(
              "=============================================="
            );

            const generatedAt =
              new Date().toISOString();

            const news =
              await getCurrentNews();

            const generated =
              await callGemini(
                news
              );

            console.log(
              `Gemini returned: ${generated.length} items`
            );

            if (
              generated.length <
              TARGET_ITEMS
            ) {
              console.error(
                `Incomplete response: expected ${TARGET_ITEMS}, got ${generated.length}.`
              );

              console.error(
                "The run is stopped so incomplete content is not published."
              );

              process.exit(1);
            }

            const normalized =
              generated
                .slice(
                  0,
                  TARGET_ITEMS
                )
                .map(
                  (item, index) =>
                    normalizeItem(
                      item,
                      index,
                      generatedAt
                    )
                )
                .filter(Boolean);

            if (
              normalized.length <
              TARGET_ITEMS
            ) {
              console.error(
                `Only ${normalized.length} complete items are valid.`
              );

              console.error(
                "Incomplete content will not be published."
              );

              process.exit(1);
            }

            const uniqueNew =
              uniqueByTitle(
                normalized
              );

            if (
              uniqueNew.length <
              TARGET_ITEMS
            ) {
              console.error(
                `Duplicate titles reduced the complete set to ${uniqueNew.length}.`
              );

              console.error(
                "Run stopped so the daily update remains complete."
              );

              process.exit(1);
            }

            const existing =
              readExisting();

            const finalContent =
              uniqueByTitle([
                ...uniqueNew,
                ...existing
              ])
                .slice(
                  0,
                  MAX_STORED_ITEMS
                );

            fs.mkdirSync(
              "content",
              {
                recursive: true
              }
            );

            fs.writeFileSync(
              CONTENT_FILE,

              JSON.stringify(
                finalContent,
                null,
                2
              ),

              "utf8"
            );

            fs.mkdirSync(
              LOG_DIR,
              {
                recursive: true
              }
            );

            const date =
              generatedAt.slice(
                0,
                10
              );

            const logFile =
              `${LOG_DIR}/${date}.json`;

            const log = {
              status: "success",

              generatedAt,

              model: MODEL,

              requestedItems:
                TARGET_ITEMS,

              generatedItems:
                generated.length,

              completeItems:
                normalized.length,

              newUniqueItems:
                uniqueNew.length,

