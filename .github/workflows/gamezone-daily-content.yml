name: GAMEZONE ARENA Daily Hindi Content

on:
  workflow_dispatch:

  schedule:
    # रोज सुबह 9:15 बजे भारत के समय पर
    - cron: "15 9 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Daily Hindi Content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > /tmp/generate-content.mjs <<'EOF'
          import fs from "fs";

          const API_KEY = process.env.GEMINI_API_KEY;

          if (!API_KEY) {
            throw new Error("GEMINI_API_KEY secret is missing.");
          }

          const NEWS_RSS =
            "https://news.google.com/rss?hl=hi&gl=IN&ceid=IN:hi";

          function decodeHtml(text) {
            return text
              .replace(/<!\[CDATA\[(.*?)\]\]>/gs, "$1")
              .replace(/&amp;/g, "&")
              .replace(/&quot;/g, '"')
              .replace(/&#39;/g, "'")
              .replace(/&lt;/g, "<")
              .replace(/&gt;/g, ">");
          }

          async function getCurrentNews() {
            try {
              const response = await fetch(NEWS_RSS);

              if (!response.ok) {
                throw new Error(`Google News RSS HTTP ${response.status}`);
              }

              const xml = await response.text();

              const titles = [...xml.matchAll(/<title>(.*?)<\/title>/gis)]
                .map(match => decodeHtml(match[1]).trim())
                .filter(Boolean)
                .slice(1, 20);

              return titles;
            } catch (error) {
              console.log("Google News RSS unavailable:", error.message);
              return [];
            }
          }

          function cleanJson(text) {
            return text
              .replace(/^```json\s*/i, "")
              .replace(/^```\s*/i, "")
              .replace(/\s*```$/i, "")
              .trim();
          }

          function slugify(text) {
            return text
              .toString()
              .trim()
              .toLowerCase()
              .replace(/[^\p{L}\p{N}]+/gu, "-")
              .replace(/^-+|-+$/g, "")
              .slice(0, 90);
          }

          async function generateWithGemini(newsTitles) {
            const today = new Date().toISOString();

            const newsContext =
              newsTitles.length > 0
                ? newsTitles.map((x, i) => `${i + 1}. ${x}`).join("\n")
                : "आज Google News headlines उपलब्ध नहीं हैं।";

            const prompt = `
तुम GAMEZONE ARENA वेबसाइट के लिए professional Hindi content editor हो।

आज की तारीख:
${today}

Google News India Hindi से मिले current headline topics:
${newsContext}

तुम्हारा काम रोज नई, मौलिक और उपयोगी Hindi सामग्री तैयार करना है।

महत्वपूर्ण नियम:

1. मुख्य भाषा Hindi Devanagari हो।
2. English technical terms जहाँ जरूरी हों वहीं रखें।
3. किसी दूसरी वेबसाइट का article copy मत करो।
4. Google News headline को सिर्फ CURRENT TOPIC/IDEA की तरह इस्तेमाल करो।
5. News के बारे में ऐसी specific जानकारी मत गढ़ो जो headline से confirm नहीं होती।
6. अगर current news की पर्याप्त जानकारी नहीं है तो उस item को evergreen/current-topic explainer बनाओ।
7. हर item genuinely useful और पढ़ने योग्य होना चाहिए।
8. एक ही topic को बार-बार अलग शब्दों में मत दोहराओ।
9. Clickbait या झूठे claims मत बनाओ।
10. SEO के लिए natural keywords इस्तेमाल करो लेकिन keyword stuffing मत करो।

हर दिन लगभग 20 items बनाओ।

इन categories को cover करो:

- jokes
- shayari
- bhakti
- bhajan
- kirtan
- knowledge
- facts
- motivation
- technology
- mobile
- Android
- Google
- internet
- AI
- gaming
- apps
- social-media
- entertainment
- cricket
- sports
- education
- health-and-lifestyle general information
- tips
- how-to
- blogging
- digital
- cybersecurity-awareness
- current-news
- trending-topics
- dialogue
- family
- festival
- interesting-facts

विशेष रूप से ऐसे topics चुनो जिनमें लोग सामान्यतः जानकारी खोजते हैं:
"कैसे करें", "क्या है", "क्यों होता है", "नया क्या आया", "मोबाइल में कैसे", "Google में कैसे", "AI कैसे इस्तेमाल करें", "Android tips", "internet tips", "gaming tips", "blogging tips" आदि।

हर item में ये fields जरूरी हैं:

{
  "type": "",
  "category": "",
  "title": "",
  "slug": "",
  "excerpt": "",
  "content": "",
  "readMoreContent": "",
  "keywords": [],
  "seoTitle": "",
  "metaDescription": "",
  "sourceNote": "",
  "datePublished": ""
}

निर्देश:

- title छोटा और स्पष्ट हो।
- excerpt 1-2 lines का हो।
- content मुख्य छोटा article हो।
- readMoreContent पूरा विस्तृत article हो।
- keywords में 5-10 natural Hindi/English search phrases हों।
- seoTitle लगभग 50-60 characters के आसपास हो।
- metaDescription लगभग 120-160 characters की हो।
- datePublished आज की date/time हो।
- jokes/shayari/bhakti जैसी evergreen सामग्री में sourceNote = "मौलिक सामग्री"
- current-news/current-topic में sourceNote = "Google News India के current topic से प्रेरित"
- किसी news headline को verbatim article की तरह copy मत करो।

CONTENT QUALITY:

हर article ऐसा हो कि visitor title देखकर "Read More" दबाए और फिर उसे पूरा उपयोगी article मिले।

Read More content में जरूरत के अनुसार:
- परिचय
- मुख्य जानकारी
- आसान explanation
- examples
- practical tips
- सावधानियाँ
- conclusion

शामिल करो।

अंत में सिर्फ valid JSON array दो।
कोई markdown नहीं।
कोई ```json नहीं।
`;

            const response = await fetch(
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=" +
                encodeURIComponent(API_KEY),
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  contents: [
                    {
                      parts: [
                        {
                          text: prompt
                        }
                      ]
                    }
                  ],
                  generationConfig: {
                    temperature: 0.8,
                    maxOutputTokens: 20000,
                    responseMimeType: "application/json"
                  }
                })
              }
            );

            const raw = await response.text();

            if (!response.ok) {
              throw new Error(
                `Gemini API ${response.status}: ${raw}`
              );
            }

            const data = JSON.parse(raw);

            const text =
              data?.candidates?.[0]?.content?.parts
                ?.map(part => part.text || "")
                .join("")
                .trim();

            if (!text) {
              throw new Error("Gemini returned empty content.");
            }

            return JSON.parse(cleanJson(text));
          }

          async function main() {
            const newsTitles = await getCurrentNews();

            console.log(
              `Current Google News topics found: ${newsTitles.length}`
            );

            const generated = await generateWithGemini(newsTitles);

            if (!Array.isArray(generated) || generated.length === 0) {
              throw new Error("Generated content is empty.");
            }

            const now = new Date();

            const items = generated.map((item, index) => {
              const title =
                item.title ||
                `GAMEZONE ARENA Hindi Content ${index + 1}`;

              return {
                type: item.type || "knowledge",
                category: item.category || "Hindi",
                title,
                slug:
                  item.slug ||
                  `${slugify(title)}-${now.getTime()}-${index}`,
                excerpt: item.excerpt || "",
                content: item.content || "",
                readMoreContent:
                  item.readMoreContent ||
                  item.content ||
                  "",
                keywords: Array.isArray(item.keywords)
                  ? item.keywords
                  : [],
                seoTitle: item.seoTitle || title,
                metaDescription:
                  item.metaDescription ||
                  item.excerpt ||
                  title,
                sourceNote:
                  item.sourceNote || "मौलिक सामग्री",
                datePublished: now.toISOString()
              };
            });

            const outputDir = "content";

            fs.mkdirSync(outputDir, { recursive: true });

            const file = `${outputDir}/auto-content.json`;

            let existing = [];

            if (fs.existsSync(file)) {
              try {
                const oldData = JSON.parse(
                  fs.readFileSync(file, "utf8")
                );

                if (Array.isArray(oldData)) {
                  existing = oldData;
                } else if (Array.isArray(oldData.items)) {
                  existing = oldData.items;
                }
              } catch {
                existing = [];
              }
            }

            /*
             * नए content को सबसे ऊपर रखें।
             * पुराने content को तुरंत delete नहीं करेंगे।
             */
            const merged = [
              ...items,
              ...existing
            ];

            /*
             * बहुत बड़ा JSON होने से बचाने के लिए
             * latest 300 items रखें।
             */
            const finalItems = merged.slice(0, 300);

            const output = {
              generatedAt: now.toISOString(),
              count: finalItems.length,
              items: finalItems
            };

            fs.writeFileSync(
              file,
              JSON.stringify(output, null, 2),
              "utf8"
            );

            console.log(
              `Saved ${finalItems.length} total items to ${file}`
            );

            /*
             * SEO article pages
             *
             * हर नए article का अपना URL बनाया जाएगा।
             * इससे Google के लिए individual pages crawl करना
             * आसान होगा।
             */
            const articlesDir = "articles";

            fs.mkdirSync(articlesDir, {
              recursive: true
            });

            const siteUrl = "https://gajpalmi.github.io";

            const articleUrls = [];

            for (const item of items) {
              const slug = item.slug;

              const articleDir = `${articlesDir}/${slug}`;

              fs.mkdirSync(articleDir, {
                recursive: true
              });

              const articleUrl =
                `${siteUrl}/articles/${slug}/`;

              articleUrls.push(articleUrl);

              const jsonLd = {
                "@context": "https://schema.org",
                "@type":
                  item.type === "current-news"
                    ? "NewsArticle"
                    : "BlogPosting",
                "headline": item.title,
                "description": item.metaDescription,
                "datePublished": item.datePublished,
                "dateModified": item.datePublished,
                "author": {
                  "@type": "Organization",
                  "name": "GAMEZONE ARENA"
                },
                "mainEntityOfPage": {
                  "@type": "WebPage",
                  "@id": articleUrl
                }
              };

              const html = `<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>${escapeHtml(item.seoTitle)}</title>

<meta name="description" content="${escapeHtml(
                item.metaDescription
              )}">

<meta name="robots" content="index,follow">

<link rel="canonical" href="${articleUrl}">

<script type="application/ld+json">
${JSON.stringify(jsonLd, null, 2)}
</script>

<style>
body {
  margin: 0;
  padding: 0;
  background: #0b0f14;
  color: #ffffff;
  font-family: Arial, sans-serif;
  line-height: 1.8;
}

article {
  max-width: 850px;
  margin: auto;
  padding: 25px;
}

h1 {
  line-height: 1.3;
}

.meta {
  opacity: .7;
  font-size: 14px;
}

.content {
  white-space: pre-wrap;
}

a {
  color: #5de6ff;
}
</style>
</head>

<body>

<article>

<a href="/">← GAMEZONE ARENA पर वापस जाएँ</a>

<h1>${escapeHtml(item.title)}</h1>

<div class="meta">
${escapeHtml(item.category)} ·
${escapeHtml(item.datePublished)}
</div>

<p>
${escapeHtml(item.excerpt)}
</p>

<div class="content">
${escapeHtml(item.readMoreContent)}
</div>

<hr>

<p>
${escapeHtml(item.sourceNote)}
</p>

<p>
© GAMEZONE ARENA
</p>

</article>

</body>
</html>`;

              fs.writeFileSync(
                `${articleDir}/index.html`,
                html,
                "utf8"
              );
            }

            /*
             * Sitemap
             */
            const sitemapUrls = [
              `${siteUrl}/`,
              ...articleUrls
            ];

            const sitemap = `<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
${sitemapUrls
  .map(
    url => `
  <url>
    <loc>${escapeXml(url)}</loc>
    <lastmod>${now.toISOString()}</lastmod>
  </url>`
  )
  .join("")}
</urlset>`;

            fs.writeFileSync(
              "sitemap.xml",
              sitemap,
              "utf8"
            );

            /*
             * robots.txt
             */
            fs.writeFileSync(
              "robots.txt",
              `User-agent: *
Allow: /

Sitemap: ${siteUrl}/sitemap.xml
`,
              "utf8"
            );

            console.log(
              `Created ${articleUrls.length} SEO article pages.`
            );
          }

          function escapeHtml(value) {
            return String(value)
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&#039;");
          }

          function escapeXml(value) {
            return String(value)
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&apos;");
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

          node /tmp/generate-content.mjs

      - name: Commit and push generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/auto-content.json articles sitemap.xml robots.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "auto: update daily Hindi content and SEO pages"

          git push
