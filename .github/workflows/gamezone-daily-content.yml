name: GAMEZONE ARENA Daily Content

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate content with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          async function main() {
            const apiKey = process.env.GEMINI_API_KEY;

            if (!apiKey) {
              console.error("GEMINI_API_KEY secret is missing.");
              process.exit(1);
            }

            const model = "gemini-3.5-flash-lite";

            const url =
              `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;

            const prompt = `
          You are the automatic content writer for the GAMEZONE ARENA website.

          Generate 12 fresh, original website content items in English.

          Rules:
          - Family-friendly and safe.
          - Do not copy copyrighted text.
          - Do not use famous-person quotations.
          - Do not invent misleading facts.
          - Do not use Markdown.
          - Return ONLY valid JSON.
          - Make every item different.

          Allowed types:
          jokes, shayari, knowledge, entertainment, bhakti, blog

          Each item must contain exactly:
          type
          title
          category
          content

          Use these categories:

          jokes:
          Funny, Desi, Friendship, Family

          shayari:
          Love, Friendship, Motivational, Life

          knowledge:
          Science, Technology, India, Space, Animals

          entertainment:
          Movies, Music, Games, Fun

          bhakti:
          Prayer, Devotional, Spiritual, Festival

          blog:
          Gaming, Technology, Lifestyle, Tips

          Generate exactly 12 items.
          `;

            const response = await fetch(url, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "x-goog-api-key": apiKey
              },
              body: JSON.stringify({
                contents: [
                  {
                    parts: [
                      {
                        text: prompt
                      }
                    ]
                  }
                ],
                generationConfig: {
                  response_mime_type: "application/json",
                  response_schema: {
                    type: "array",
                    items: {
                      type: "object",
                      properties: {
                        type: { type: "string" },
                        title: { type: "string" },
                        category: { type: "string" },
                        content: { type: "string" }
                      },
                      required: [
                        "type",
                        "title",
                        "category",
                        "content"
                      ]
                    }
                  },
                  temperature: 0.9
                }
              })
            });

            const result = await response.json();

            if (!response.ok) {
              console.error("Gemini API request failed:");
              console.error(JSON.stringify(result, null, 2));
              process.exit(1);
            }

            const text =
              result?.candidates?.[0]?.content?.parts?.[0]?.text;

            if (!text) {
              console.error("Gemini returned no content.");
              console.error(JSON.stringify(result, null, 2));
              process.exit(1);
            }

            let items;

            try {
              items = JSON.parse(text);
            } catch (error) {
              console.error("Gemini returned invalid JSON.");
              console.error(text);
              process.exit(1);
            }

            if (!Array.isArray(items)) {
              console.error("Gemini response is not an array.");
              process.exit(1);
            }

            const allowedTypes = new Set([
              "jokes",
              "shayari",
              "knowledge",
              "entertainment",
              "bhakti",
              "blog"
            ]);

            const cleanItems = items
              .filter(item =>
                item &&
                allowedTypes.has(item.type) &&
                typeof item.title === "string" &&
                typeof item.category === "string" &&
                typeof item.content === "string"
              )
              .map(item => ({
                type: item.type.trim(),
                title: item.title.trim(),
                category: item.category.trim(),
                content: item.content.trim(),
                generatedAt: new Date().toISOString()
              }))
              .filter(item =>
                item.title && item.content
              );

            if (cleanItems.length === 0) {
              console.error("No valid content was generated.");
              process.exit(1);
            }

            const file = "content/auto-content.json";

            fs.mkdirSync("content", { recursive: true });

            let existing = [];

            if (fs.existsSync(file)) {
              try {
                const raw = fs.readFileSync(file, "utf8");

                if (raw.trim()) {
                  const parsed = JSON.parse(raw);

                  if (Array.isArray(parsed)) {
                    existing = parsed;
                  }
                }
              } catch (error) {
                console.log("Starting with empty content list.");
              }
            }

            const finalContent = [
              ...existing,
              ...cleanItems
            ];

            fs.writeFileSync(
              file,
              JSON.stringify(finalContent, null, 2),
              "utf8"
            );

            console.log(
              `Added ${cleanItems.length} items. Total: ${finalContent.length}`
            );
          }

          main().catch(error => {
            console.error("Workflow script failed:");
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit generated content
        run: |
          git config user.name "GAMEZONE ARENA Auto Content"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/auto-content.json

          if git diff --cached --quiet; then
            echo "No content changes to commit."
            exit 0
          fi

          git commit -m "Generate daily GAMEZONE ARENA content"
          git push
