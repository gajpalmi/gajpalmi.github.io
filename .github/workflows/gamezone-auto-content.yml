name: GAMEZONE ARENA Auto Content

on:
  schedule:
    - cron: "45 3 * * *"

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate and save Hindi content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const API_KEY = process.env.GEMINI_API_KEY;

          if (!API_KEY) {
            console.error("GEMINI_API_KEY secret is missing.");
            process.exit(1);
          }

          const NEWS_URL =
            "https://news.google.com/rss?hl=hi&gl=IN&ceid=IN:hi";

          const OUTPUT_FILE =
            "content/auto-content.json";

          function cleanText(text) {
            return String(text || "")
              .replace(/<!\[CDATA\[(.*?)\]\]>/gs, "$1")
              .replace(/<[^>]*>/g, " ")
              .replace(/&amp;/g, "&")
              .replace(/&quot;/g, '"')
              .replace(/&#39;/g, "'")
              .replace(/&lt;/g, "<")
              .replace(/&gt;/g, ">")
              .replace(/\s+/g, " ")
              .trim();
          }

          async function getNews() {
            try {
              console.log("Getting current Hindi Google News...");

              const response = await fetch(NEWS_URL);

              if (!response.ok) {
                console.log(
                  "Google News request failed:",
                  response.status
                );
                return [];
              }

              const xml = await response.text();
              const items = [];

              for (const match of xml.matchAll(
                /<item>([\s\S]*?)<\/item>/g
              )) {
                const block = match[1];

                const title =
                  block.match(
                    /<title>([\s\S]*?)<\/title>/
                  );

                const description =
                  block.match(
                    /<description>([\s\S]*?)<\/description>/
                  );

                const link =
                  block.match(
                    /<link>([\s\S]*?)<\/link>/
                  );

                if (!title) continue;

                const item = {
                  title: cleanText(title[1]),
                  description: cleanText(
                    description ? description[1] : ""
                  ),
                  link: cleanText(
                    link ? link[1] : ""
                  )
                };

                if (!item.title) continue;

                if (
                  items.some(
                    x => x.title === item.title
                  )
                ) {
                  continue;
                }

                items.push(item);

                if (items.length >= 20) {
                  break;
                }
              }

              console.log(
                "News items found:",
                items.length
              );

              return items;

            } catch (error) {
              console.log(
                "Google News could not be loaded:",
                error.message
              );

              return [];
            }
          }

          function makeNewsContext(news) {
            if (!news.length) {
              return "आज current Hindi news data उपलब्ध नहीं है।";
            }

            return news
              .map((item, index) => {
                return [
                  `NEWS ${index + 1}`,
                  `Headline: ${item.title}`,
                  `Description: ${item.description || "उपलब्ध नहीं"}`,
                  `Source: ${item.link || "उपलब्ध नहीं"}`
                ].join("\n");
              })
              .join("\n\n");
          }

          function extractJson(text) {
            let value = String(text || "").trim();

            value = value
              .replace(/^```json\s*/i, "")
              .replace(/^```\s*/i, "")
              .replace(/\s*```$/i, "")
              .trim();

            try {
              return JSON.parse(value);
            } catch (_) {}

            const first = value.indexOf("{");
            const last = value.lastIndexOf("}");

            if (first !== -1 && last !== -1) {
              try {
                return JSON.parse(
                  value.slice(first, last + 1)
                );
              } catch (_) {}
            }

            throw new Error(
              "Gemini returned invalid JSON."
            );
          }

          async function callGemini(prompt) {
            const models = [
              "gemini-3.5-flash-lite",
              "gemini-2.5-flash-lite",
              "gemini-2.5-flash"
            ];

            let lastError = null;

            for (const model of models) {
              try {
                console.log(
                  "Trying Gemini model:",
                  model
                );

                const url =
                  `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;

                const body = {
                  contents: [
                    {
                      parts: [
                        {
                          text: prompt
                        }
                      ]
                    }
                  ],
                  generationConfig: {
                    temperature: 0.9,
                    responseMimeType: "application/json"
                  }
                };

                const response = await fetch(
                  url,
                  {
                    method: "POST",
                    headers: {
                      "Content-Type": "application/json",
                      "x-goog-api-key": API_KEY
                    },
                    body: JSON.stringify(body)
                  }
                );

                const result =
                  await response.json();

                if (!response.ok) {
                  lastError =
                    new Error(
                      `${model}: ${response.status} ${JSON.stringify(result)}`
                    );

                  console.log(
                    "Model failed:",
                    model,
                    response.status
                  );

                  continue;
                }

                const text =
                  result
                    ?.candidates?.[0]
                    ?.content?.parts?.[0]
                    ?.text;

                if (!text) {
                  lastError =
                    new Error(
                      `${model}: Gemini returned no text`
                    );

                  continue;
                }

                return text;

              } catch (error) {
                lastError = error;

                console.log(
                  "Gemini request error:",
                  error.message
                );
              }
            }

            throw lastError ||
              new Error(
                "No Gemini model worked."
              );
          }

          async function main() {
            console.log(
              "================================"
            );
            console.log(
              "GAMEZONE ARENA AUTO CONTENT"
            );
            console.log(
              "================================"
            );

            const news =
              await getNews();

            const newsContext =
              makeNewsContext(news);

            const prompt = `
आप GAMEZONE ARENA वेबसाइट के automatic Hindi content editor हैं।

हर दिन EXACTLY 20 नए, मौलिक और पूरा readable content items बनाइए।

सभी user-facing content मुख्य रूप से सरल, स्वाभाविक हिंदी देवनागरी में हो।

आज के current topics के लिए नीचे दिया गया Google News India Hindi data केवल source/context है।

================ CURRENT NEWS ================

${newsContext}

================================================

बहुत महत्वपूर्ण:

किसी भी content को केवल headline, title या छोटा snippet बनाकर समाप्त नहीं करना है।

हर item का पूरा article/readable content "content" field में होना चाहिए।

हर item visitor के लिए website पर पढ़ने योग्य होना चाहिए।

NEWS RULES:

यदि item news/current topic है तो उपलब्ध headline और description के आधार पर सावधान Hindi explainer लिखें।

समझाएं:
- विषय क्या है
- उपलब्ध मुख्य जानकारी क्या है
- सामान्य context क्या है
- reader के लिए इसका क्या अर्थ है

लेकिन उपलब्ध source में न होने वाले:
- नाम
- तारीख
- संख्या
- आंकड़े
- quote
- बयान
- आरोप
- स्थान
- घटना की अतिरिक्त details

अपनी तरफ से invent नहीं करनी हैं।

Fake news नहीं बनानी है।

News source note:
"Google News headlines से topic लिया गया"

CONTENT TYPES में variety रखें:

- jokes
- dialogue
- shayari
- bhakti
- bhajan
- kirtan
- knowledge
- general knowledge
- news
- mobile
- android
- internet
- online safety
- ai
- technology
- gaming
- ludo
- cricket
- blogging
- how-to
- entertainment
- trends
- motivation
- life
- friendship
- love

JOKES:
पूरा setup और punchline दें।

DIALOGUE:
पूरा natural dialogue दें।

SHAYARI:
मौलिक और पूरी shayari दें।
केवल 1-2 lines नहीं।

BHAKTI:
पूरा devotional content दें।
सिर्फ जयकारा या छोटी line नहीं।

BHAJAN:
मौलिक devotional content दें।
किसी प्रसिद्ध copyrighted bhajan के पूरे lyrics copy नहीं करने हैं।

KIRTAN:
मौलिक और सम्मानजनक content दें।

KNOWLEDGE:
विषय को सरल भाषा में समझाएं।

MOBILE/ANDROID:
Practical tips दें:
settings, privacy, storage, battery, apps, security आदि।

INTERNET:
Phishing, scams, fake links, passwords और privacy पर useful जानकारी दें।

AI/TECHNOLOGY:
AI, Google, apps, internet और technology को सरल भाषा में समझाएं।

GAMING:
Ludo, Cricket, mobile gaming और gaming tips पर पूरा readable content दें।

HOW-TO:
जरूरत होने पर:
1. समस्या
2. तैयारी
3. step-by-step तरीका
4. सावधानी
5. conclusion

BLOG:
सिर्फ छोटा paragraph नहीं।
पूरा useful article दें।

ENTERTAINMENT/TRENDING:
उपलब्ध जानकारी के आधार पर पूरा readable content दें।
Unsupported claims न बनाएं।

GENERAL RULES:

1. EXACTLY 20 items।
2. सभी content मौलिक होना चाहिए।
3. पुराने content की copy नहीं।
4. एक ही idea बार-बार नहीं।
5. Family-friendly content।
6. सरल हिंदी।
7. हर item दूसरे item से अलग।
8. SEO-friendly title।
9. 3 से 8 keywords।
10. seoTitle।
11. metaDescription।
12. sourceNote।
13. Fake quotes नहीं।
14. Fake news नहीं।
15. Political persuasion नहीं।
16. बिना आधार आरोप नहीं।
17. Health/finance/investment में guaranteed claims नहीं।
18. Copyrighted articles या lyrics copy नहीं।
19. Current news में unsupported facts invent नहीं।
20. content field पर्याप्त पूरा और readable होना चाहिए।

SOURCE NOTES:

News/current:
"Google News headlines से topic लिया गया"

Original jokes/shayari/bhakti/dialogue:
"मौलिक सामग्री"

Knowledge/tips/how-to/blog/technology/gaming:
"मौलिक सामग्री"

JSON के अलावा कोई text नहीं।

EXACT JSON FORMAT:

{
  "items": [
    {
      "type": "news",
      "title": "शीर्षक",
      "category": "India",
      "content": "पूरा readable content",
      "keywords": [
        "keyword1",
        "keyword2",
        "keyword3"
      ],
      "seoTitle": "SEO title",
      "metaDescription": "SEO description",
      "sourceNote": "source note"
    }
  ]
}
`;

            const responseText =
              await callGemini(prompt);

            const parsed =
              extractJson(responseText);

            if (
              !parsed ||
              !Array.isArray(parsed.items)
            ) {
              throw new Error(
                "Gemini response has no items array."
              );
            }

            const allowedTypes =
              new Set([
                "jokes",
                "joke",
                "dialogue",
                "shayari",
                "bhakti",
                "bhajan",
                "kirtan",
                "knowledge",
                "gk",
                "news",
                "mobile",
                "android",
                "internet",
                "ai",
                "technology",
                "gaming",
                "ludo",
                "cricket",
                "blog",
                "blogs",
                "how-to",
                "howto",
                "entertainment",
                "trends",
                "motivation",
                "life",
                "friendship",
                "love",
                "tips"
              ]);

            const normalizeType =
              type => {
                const t =
                  String(type || "")
                    .trim()
                    .toLowerCase();

                const map = {
                  joke: "jokes",
                  jokes: "jokes",
                  blogs: "blog",
                  howto: "how-to",
                  gk: "knowledge",
                  android: "mobile",
                  ludo: "gaming",
                  cricket: "gaming",
                  trends: "entertainment",
                  motivation: "knowledge",
                  life: "shayari",
                  friendship: "shayari",
                  love: "shayari"
                };

                return map[t] || t || "blog";
              };

            const newItems =
              parsed.items
                .filter(item =>
                  item &&
                  typeof item.title === "string" &&
                  typeof item.content === "string"
                )
                .slice(0, 20)
                .map(item => ({
                  type:
                    normalizeType(item.type),

                  title:
                    String(item.title).trim(),

                  category:
                    String(
                      item.category ||
                      "General"
                    ).trim(),

                  content:
                    String(item.content).trim(),

                  keywords:
                    Array.isArray(item.keywords)
                      ? item.keywords
                          .map(x =>
                            String(x).trim()
                          )
                          .filter(Boolean)
                          .slice(0, 8)
                      : [],

                  seoTitle:
                    String(
                      item.seoTitle ||
                      item.title
                    ).trim(),

                  metaDescription:
                    String(
                      item.metaDescription ||
                      item.content
                    )
                      .trim()
                      .slice(0, 160),

                  sourceNote:
                    String(
                      item.sourceNote ||
                      "मौलिक सामग्री"
                    ).trim(),

                  generatedAt:
                    new Date().toISOString()
                }))
                .filter(
                  item =>
                    item.title &&
                    item.content
                );

            if (newItems.length === 0) {
              throw new Error(
                "No valid content generated."
              );
            }

            fs.mkdirSync(
              "content",
              {
                recursive: true
              }
            );

            let oldItems = [];

            if (
              fs.existsSync(OUTPUT_FILE)
            ) {
              try {
                const oldRaw =
                  fs.readFileSync(
                    OUTPUT_FILE,
                    "utf8"
                  );

                const oldData =
                  JSON.parse(oldRaw);

                if (Array.isArray(oldData)) {
                  oldItems = oldData;
                } else if (
                  Array.isArray(
                    oldData.items
                  )
                ) {
                  oldItems =
                    oldData.items;
                }
              } catch (error) {
                console.log(
                  "Existing content could not be parsed."
                );
              }
            }

            /*
              नया content सबसे ऊपर।
              पुराना content delete नहीं होगा।
              maximum 300 items रखे जाएंगे।
            */

            const finalItems =
              [
                ...newItems,
                ...oldItems
              ].slice(0, 300);

            fs.writeFileSync(
              OUTPUT_FILE,
              JSON.stringify(
                finalItems,
                null,
                2
              ),
              "utf8"
            );

            console.log(
              "================================"
            );

            console.log(
              "New items:",
              newItems.length
            );

            console.log(
              "Total stored:",
              finalItems.length
            );

            console.log(
              "Output:",
              OUTPUT_FILE
            );

            console.log(
              "================================"
            );
          }

          main().catch(error => {
            console.error(
              "AUTO CONTENT FAILED:"
            );

            console.error(
              error
            );

            process.exit(1);
          });
          NODE

      - name: Commit new content
        run: |
          git config user.name "GAMEZONE ARENA Auto Content"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/auto-content.json

          if git diff --cached --quiet; then
            echo "No content changes to commit."
            exit 0
          fi

          git commit -m "Update GAMEZONE ARENA daily Hindi content"
          git push
