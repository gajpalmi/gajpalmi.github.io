import fs from "node:fs";
import path from "node:path";

const API_KEY = process.env.GEMINI_API_KEY;

if (!API_KEY) {
  throw new Error("GEMINI_API_KEY secret is missing.");
}

const MODEL = "gemini-3.5-flash-lite";
const API_URL =
  `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`;

const NEWS_URL =
  "https://news.google.com/rss?hl=hi&gl=IN&ceid=IN:hi";

function stripHtml(text) {
  return text
    .replace(/<[^>]*>/g, " ")
    .replace(/&amp;/g, "&")
    .replace(/&quot;/g, '"')
    .replace(/&#39;/g, "'")
    .replace(/&lt;/g, "<")
    .replace(/&gt;/g, ">")
    .replace(/\s+/g, " ")
    .trim();
}

async function getNews() {
  const response = await fetch(NEWS_URL);

  if (!response.ok) {
    throw new Error(`Google News request failed: ${response.status}`);
  }

  const xml = await response.text();

  const items = [];
  const matches = xml.matchAll(/<item>([\s\S]*?)<\/item>/g);

  for (const match of matches) {
    const block = match[1];
    const titleMatch = block.match(/<title>([\s\S]*?)<\/title>/);

    if (titleMatch) {
      const title = stripHtml(titleMatch[1]);

      if (title && !items.includes(title)) {
        items.push(title);
      }
    }

    if (items.length >= 15) break;
  }

  return items;
}

async function generateContent(news) {
  const newsText =
    news.length > 0
      ? news.map((x, i) => `${i + 1}. ${x}`).join("\n")
      : "आज के समाचार उपलब्ध नहीं हैं।";

  const prompt = `
तुम GAMEZONE ARENA वेबसाइट के लिए रोज़ नई हिंदी सामग्री तैयार करने वाले संपादक हो।

सारी user-facing सामग्री मुख्य रूप से सरल और स्वाभाविक हिंदी देवनागरी में हो।

आज के current topics के लिए नीचे दिए Google News India headlines को केवल संदर्भ की तरह इस्तेमाल करो:

${newsText}

कुल 20 अलग-अलग सामग्री तैयार करो।

इन विषयों को मिलाकर सामग्री बनाओ:

1. हिंदी चुटकुले
2. मजेदार संवाद
3. सुविचार
4. हिंदी शायरी
5. प्रेम शायरी
6. दोस्ती शायरी
7. भक्ति
8. भजन/कीर्तन से संबंधित मौलिक जानकारी
9. ज्ञान
10. सामान्य ज्ञान
11. मोबाइल
12. इंटरनेट
13. AI
14. Google और technology
15. gaming
16. blogging
17. आज के current topics/news से संबंधित सरल जानकारी
18. उपयोगी how-to जानकारी
19. मनोरंजन
20. trending search topics

महत्वपूर्ण नियम:

- झूठी खबर मत बनाओ।
- current news में केवल दिए गए headlines से प्रेरित सामान्य जानकारी दो।
- किसी व्यक्ति या संस्था पर बिना आधार आरोप मत लगाओ।
- भक्ति सामग्री सम्मानजनक रखो।
- मौलिक सामग्री लिखो।
- किसी वेबसाइट का पूरा article copy मत करो।
- हर item दूसरे item से अलग हो।
- content इतना छोटा न हो कि Read More बेकार हो जाए।
- प्रत्येक article के लिए पूरा उपयोगी content दो।
- SEO के लिए keywords भी दो।

केवल valid JSON लौटाओ।
Markdown मत लौटाओ।
JSON के बाहर कोई text मत लिखो।

JSON format:

{
  "items": [
    {
      "type": "jokes",
      "category": "Funny",
      "title": "शीर्षक",
      "excerpt": "छोटा परिचय",
      "content": "पूरा लेख",
      "readMoreContent": "पूरा विस्तृत लेख",
      "keywords": ["हिंदी", "गेमिंग", "ज्ञान"],
      "seoTitle": "SEO शीर्षक",
      "metaDescription": "Meta description",
      "sourceNote": "मौलिक सामग्री"
    }
  ]
}
`;

  const body = {
    contents: [
      {
        parts: [
          {
            text: prompt
          }
        ]
      }
    ],
    generationConfig: {
      temperature: 0.9,
      responseMimeType: "application/json"
    }
  };

  const response = await fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(body)
  });

  if (!response.ok) {
    const errorText = await response.text();
    throw new Error(
      `Gemini API failed: ${response.status}\n${errorText}`
    );
  }

  const data = await response.json();

  const text =
    data?.candidates?.[0]?.content?.parts?.[0]?.text;

  if (!text) {
    throw new Error("Gemini returned empty content.");
  }

  return JSON.parse(text);
}

function slugify(text) {
  return text
    .toString()
    .trim()
    .toLowerCase()
    .replace(/[^\p{L}\p{N}\s-]/gu, "")
    .replace(/\s+/g, "-")
    .replace(/-+/g, "-")
    .slice(0, 100);
}

function escapeHtml(text) {
  return String(text ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function createArticle(item, date) {
  const slug =
    item.slug ||
    `${slugify(item.title)}-${Date.now()}`;

  const dir = path.join("articles", slug);
  fs.mkdirSync(dir, { recursive: true });

  const html = `<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${escapeHtml(item.seoTitle || item.title)}</title>
<meta name="description" content="${escapeHtml(item.metaDescription || item.excerpt || "")}">
<meta name="robots" content="index,follow">
</head>
<body>
<main>
<h1>${escapeHtml(item.title)}</h1>

<p>${escapeHtml(item.excerpt || "")}</p>

<article>
${escapeHtml(item.content || "").replace(/\n/g, "<br><br>")}

<br><br>

${escapeHtml(item.readMoreContent || "").replace(/\n/g, "<br><br>")}
</article>

<p><small>${escapeHtml(item.sourceNote || "मौलिक सामग्री")}</small></p>

<p><a href="/">← GAMEZONE ARENA पर वापस जाएँ</a></p>
</main>
</body>
</html>`;

  fs.writeFileSync(
    path.join(dir, "index.html"),
    html,
    "utf8"
  );

  return slug;
}

async function main() {
  console.log("Getting current Google News headlines...");

  const news = await getNews();

  console.log(`News headlines found: ${news.length}`);

  console.log("Generating Hindi content...");

  const result = await generateContent(news);

  if (!Array.isArray(result.items)) {
    throw new Error("Gemini JSON does not contain items array.");
  }

  const today = new Date().toISOString();

  const newItems = result.items.map((item) => ({
    ...item,
    datePublished: today
  }));

  const contentDir = "content";
  fs.mkdirSync(contentDir, { recursive: true });

  const jsonFile = path.join(
    contentDir,
    "auto-content.json"
  );

  let oldItems = [];

  if (fs.existsSync(jsonFile)) {
    try {
      const oldData = JSON.parse(
        fs.readFileSync(jsonFile, "utf8")
      );

      if (Array.isArray(oldData)) {
        oldItems = oldData;
      } else if (Array.isArray(oldData.items)) {
        oldItems = oldData.items;
      }
    } catch {
      console.log("Existing JSON could not be read. Starting fresh.");
    }
  }

  const combined = [
    ...newItems,
    ...oldItems
  ].slice(0, 300);

  fs.writeFileSync(
    jsonFile,
    JSON.stringify(combined, null, 2),
    "utf8"
  );

  console.log(
    `Saved ${newItems.length} new items. Total stored: ${combined.length}`
  );

  for (const item of newItems) {
    createArticle(item, today);
  }

  const siteUrl = "https://gajpalmi.github.io/";

  const urls = [];

  for (const item of combined) {
    if (item.title) {
      const slug =
        item.slug ||
        slugify(item.title);

      urls.push(
        `${siteUrl}articles/${slug}/`
      );
    }
  }

  const sitemapUrls = urls
    .map(
      (url) =>
        `  <url><loc>${escapeHtml(url)}</loc></url>`
    )
    .join("\n");

  const sitemap = `<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
  <url>
    <loc>${siteUrl}</loc>
  </url>
${sitemapUrls}
</urlset>`;

  fs.writeFileSync(
    "sitemap.xml",
    sitemap,
    "utf8"
  );

  fs.writeFileSync(
    "robots.txt",
    `User-agent: *
Allow: /

Sitemap: ${siteUrl}sitemap.xml
`,
    "utf8"
  );

  console.log("Content generation completed successfully.");
}

main().catch((error) => {
  console.error(error);
  process.exit(1);
});
