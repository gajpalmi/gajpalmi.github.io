name: GAMEZONE ARENA Daily Hindi Content

"on":
  workflow_dispatch:
  schedule:
    - cron: "45 3 * * *"

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Hindi content with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const API_KEY = process.env.GEMINI_API_KEY;

          if (!API_KEY) {
            console.error("GEMINI_API_KEY secret is missing.");
            process.exit(1);
          }

          const MODEL = "gemini-3.5-flash-lite";

          const API_URL =
            `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`;

          const NEWS_URL =
            "https://news.google.com/rss?hl=hi&gl=IN&ceid=IN:hi";

          function cleanText(text) {
            return String(text || "")
              .replace(/<!\[CDATA\[(.*?)\]\]>/g, "$1")
              .replace(/<[^>]*>/g, " ")
              .replace(/&amp;/g, "&")
              .replace(/&quot;/g, '"')
              .replace(/&#39;/g, "'")
              .replace(/&lt;/g, "<")
              .replace(/&gt;/g, ">")
              .replace(/\s+/g, " ")
              .trim();
          }

          async function getCurrentNews() {
            try {
              console.log("Getting current Google News India headlines...");

              const response = await fetch(NEWS_URL);

              if (!response.ok) {
                console.log(
                  `Google News RSS unavailable. Status: ${response.status}`
                );
                return [];
              }

              const xml = await response.text();
              const titles = [];

              const matches = xml.matchAll(
                /<item>([\s\S]*?)<\/item>/g
              );

              for (const match of matches) {
                const block = match[1];

                const titleMatch = block.match(
                  /<title>([\s\S]*?)<\/title>/
                );

                if (!titleMatch) {
                  continue;
                }

                const title = cleanText(titleMatch[1]);

                if (title && !titles.includes(title)) {
                  titles.push(title);
                }

                if (titles.length >= 20) {
                  break;
                }
              }

              console.log(
                `Current headlines found: ${titles.length}`
              );

              return titles;
            } catch (error) {
              console.log("Could not load Google News.");
              console.log(error.message);
              return [];
            }
          }

          async function generateContent(news) {
            const newsText =
              news.length > 0
                ? news
                    .map(
                      (title, index) =>
                        `${index + 1}. ${title}`
                    )
                    .join("\n")
                : "No current headlines are available.";

            const prompt = `
You are the professional automatic content editor for the GAMEZONE ARENA website.

IMPORTANT LANGUAGE REQUIREMENT:

All user-facing generated content must be written in simple, natural Hindi using Devanagari script.

The code, instructions, JSON field names, category names, and technical values must remain in English.

Brand names, app names, website names, product names, technical terms, Android terms, AI terms, Google terms, gaming terms, and necessary English words may remain in English when natural.

Use the following current Google News India Hindi headlines only as reference for current topics:

${newsText}

Generate EXACTLY 20 different content items.

CONTENT TYPES:

1. Hindi jokes
2. Funny dialogues
3. Hindi motivational thoughts
4. Hindi shayari
5. Love shayari
6. Friendship shayari
7. Life shayari
8. Motivational shayari
9. Devotional content
10. Bhajan
11. Kirtan
12. Spiritual information
13. Knowledge
14. General knowledge
15. Current news and current topics
16. Mobile and Android tips
17. Internet and online safety
18. AI, Google and technology
19. Gaming, Ludo, Cricket and gaming tips
20. Blogging, How-to, Entertainment and trending topics

Mix different subjects so that the website receives fresh and varied content every day.

CATEGORIES:

Jokes:
Funny, Desi, Family, Friendship, School, Office

Shayari:
Love, Friendship, Life, Motivational, Emotional

Bhakti:
Prayer, Devotional, Spiritual, Bhajan, Kirtan, Festival

Knowledge:
Science, India, Space, Animals, History, General Knowledge

News:
India, World, Technology, Sports, Entertainment, Trending

Technology:
Technology, AI, Google, Internet, Apps, Gadgets, Cyber Safety

Mobile:
Android, Mobile Tips, Apps, Smartphones, Settings, Security

Gaming:
Games, Gaming Tips, Mobile Gaming, Ludo, Cricket, Esports

Blogging:
Blogging, SEO, Website, Content, How-To, Internet

CONTENT RULES:

1. All generated content must be original.
2. Do not copy previous content.
3. Do not repeat the same joke, shayari or idea.
4. Keep everything family-friendly.
5. Use simple, natural and readable Hindi.
6. Jokes should actually be entertaining and readable.
7. Dialogues should be short, natural and interesting.
8. Shayari must be original.
9. Love and friendship content must remain respectful.
10. Devotional, bhajan and kirtan content must be respectful and original.
11. Do not create fake quotes attributed to famous people.
12. Do not create false knowledge or general knowledge facts.
13. Do not create fake news.
14. For current news, use only the supplied headlines as topic references.
15. Do not invent facts beyond the information available in the headlines.
16. Do not make unsupported allegations about people or organizations.
17. Do not attempt political persuasion.
18. Do not make guaranteed or unsupported health, financial or investment claims.
19. Do not copy complete articles, paragraphs or content from other websites.
20. Do not closely reproduce copyrighted articles.
21. For trending topics, provide safe general information based only on available current context.
22. If a headline does not provide enough information, do not invent additional details.
23. Mobile, Android, Internet, AI, Google, Technology and Gaming content should be practical and useful.
24. How-to content should be clear, practical and step-by-step.
25. Blog content should provide useful detail.
26. Every item must be meaningfully different from the other items.
27. Content must not be so short that it becomes useless for a website.
28. Every item must have an SEO-friendly title.
29. Every item must have 3 to 8 useful keywords.
30. Every item must contain a sourceNote.

SOURCE NOTE RULES:

For current, news and trending topics:
"Topic reference from Google News headlines"

For original jokes, shayari, bhakti and dialogue:
"Original content"

For knowledge, tips, how-to and blog content:
"Original content"

Do not put URLs inside sourceNote.

IMPORTANT CURRENT NEWS RULE:

Do not invent a current news article.

If only a headline is available, write general information related to that headline without adding unsupported facts.

Other content may be evergreen original content.

Return EXACTLY 20 items.

Return JSON only.

Do not return Markdown.

Do not return explanations outside JSON.

JSON structure:

{
  "items": [
    {
      "type": "jokes",
      "title": "Hindi title written in Devanagari",
      "category": "Funny",
      "content": "Complete useful Hindi content written in Devanagari",
      "keywords": [
        "Hindi keyword",
        "Hindi keyword",
        "Hindi keyword"
      ],
      "seoTitle": "SEO title",
      "metaDescription": "Short SEO description",
      "sourceNote": "Original content"
    }
  ]
}
`;

            const body = {
              contents: [
                {
                  parts: [
                    {
                      text: prompt
                    }
                  ]
                }
              ],
              generationConfig: {
                temperature: 0.9,
                responseMimeType: "application/json",
                responseSchema: {
                  type: "OBJECT",
                  properties: {
                    items: {
                      type: "ARRAY",
                      items: {
                        type: "OBJECT",
                        properties: {
                          type: {
                            type: "STRING"
                          },
                          title: {
                            type: "STRING"
                          },
                          category: {
                            type: "STRING"
                          },
                          content: {
                            type: "STRING"
                          },
                          keywords: {
                            type: "ARRAY",
                            items: {
                              type: "STRING"
                            }
                          },
                          seoTitle: {
                            type: "STRING"
                          },
                          metaDescription: {
                            type: "STRING"
                          },
                          sourceNote: {
                            type: "STRING"
                          }
                        },
                        required: [
                          "type",
                          "title",
                          "category",
                          "content",
                          "keywords",
                          "seoTitle",
                          "metaDescription",
                          "sourceNote"
                        ]
                      }
                    }
                  },
                  required: [
                    "items"
                  ]
                }
              }
            };

            console.log("Sending request to Gemini...");

            const response = await fetch(
              API_URL,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "x-goog-api-key": API_KEY
                },
                body: JSON.stringify(body)
              }
            );

            const result = await response.json();

            if (!response.ok) {
              console.error("Gemini API request failed.");
              console.error(
                JSON.stringify(result, null, 2)
              );
              process.exit(1);
            }

            const text =
              result?.candidates?.[0]?.content?.parts?.[0]?.text;

            if (!text) {
              console.error("Gemini returned no content.");
              console.error(
                JSON.stringify(result, null, 2)
              );
              process.exit(1);
            }

            let parsed;

            try {
              parsed = JSON.parse(text);
            } catch (error) {
              console.error("Gemini returned invalid JSON.");
              console.error(text);
              process.exit(1);
            }

            if (
              !parsed ||
              !Array.isArray(parsed.items)
            ) {
              console.error(
                "Gemini response does not contain an items array."
              );
              process.exit(1);
            }

            return parsed.items;
          }

          async function main() {
            console.log("================================");
            console.log("GAMEZONE ARENA DAILY CONTENT");
            console.log("================================");

            const news = await getCurrentNews();

            const generated = await generateContent(news);

            const allowedTypes = new Set([
              "jokes",
              "shayari",
              "bhakti",
              "knowledge",
              "news",
              "technology",
              "mobile",
              "gaming",
              "entertainment",
              "dialogue",
              "internet",
              "ai",
              "tips",
              "blog"
            ]);

            const cleanItems = generated
              .filter(
                item =>
                  item &&
                  typeof item.title === "string" &&
                  typeof item.content === "string"
              )
              .map(item => ({
                type:
                  allowedTypes.has(
                    String(item.type || "").trim()
                  )
                    ? String(item.type).trim()
                    : "blog",

                title:
                  String(item.title).trim(),

                category:
                  String(
                    item.category || "General"
                  ).trim(),

                content:
                  String(item.content).trim(),

                keywords:
                  Array.isArray(item.keywords)
                    ? item.keywords
                        .map(x => String(x).trim())
                        .filter(Boolean)
                        .slice(0, 8)
                    : [],

                seoTitle:
                  String(
                    item.seoTitle || item.title
                  ).trim(),

                metaDescription:
                  String(
                    item.metaDescription ||
                    item.content
                  )
                    .trim()
                    .slice(0, 160),

                sourceNote:
                  String(
                    item.sourceNote ||
                    "Original content"
                  ).trim(),

                generatedAt:
                  new Date().toISOString()
              }))
              .filter(
                item =>
                  item.title &&
                  item.content
              );

            if (cleanItems.length === 0) {
              console.error(
                "No valid content was generated."
              );
              process.exit(1);
            }

            const file =
              "content/auto-content.json";

            fs.mkdirSync(
              "content",
              {
                recursive: true
              }
            );

            let existing = [];

            if (fs.existsSync(file)) {
              try {
                const raw =
                  fs.readFileSync(
                    file,
                    "utf8"
                  );

                if (raw.trim()) {
                  const parsed =
                    JSON.parse(raw);

                  if (Array.isArray(parsed)) {
                    existing = parsed;
                  } else if (
                    Array.isArray(parsed.items)
                  ) {
                    existing = parsed.items;
                  }
                }
              } catch (error) {
                console.log(
                  "Existing content could not be read."
                );
                console.log(
                  "Starting with an empty existing content list."
                );
              }
            }

            const finalContent = [
              ...cleanItems,
              ...existing
            ].slice(0, 300);

            fs.writeFileSync(
              file,
              JSON.stringify(
                finalContent,
                null,
                2
              ),
              "utf8"
            );

            console.log(
              `New Hindi items added: ${cleanItems.length}`
            );

            console.log(
              `Total stored items: ${finalContent.length}`
            );

            console.log(
              "================================"
            );

            console.log(
              "CONTENT GENERATION SUCCESS"
            );

            console.log(
              "================================"
            );
          }

          main().catch(error => {
            console.error(
              "Workflow script failed:"
            );

            console.error(error);

            process.exit(1);
          });
          NODE

      - name: Commit generated content
        run: |
          git config user.name "GAMEZONE ARENA Auto Content"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No content changes to commit."
            exit 0
          fi

          git commit -m "Generate daily Hindi GAMEZONE ARENA content"

          git push
