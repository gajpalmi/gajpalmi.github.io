name: GAMEZONE ARENA Daily Content

"on":
schedule:
- cron: "45 3 * * *"

permissions:
contents: write

jobs:
daily-content:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Generate daily content
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    run: |
      node <<'NODE'
      const fs = require("fs");

      const apiKey = process.env.GEMINI_API_KEY;

      if (!apiKey) {
        console.error("GEMINI_API_KEY is missing.");
        process.exit(1);
      }

      async function main() {
        const prompt = `

Generate original Hindi content for GAMEZONE ARENA.

Return ONLY valid JSON.

Use exactly this structure:

{
"jokes": [],
"shayari": [],
"bhakti": [],
"knowledge": [],
"technology": [],
"gaming": [],
"entertainment": [],
"blog": []
}

Create exactly 3 items in every category.

Rules:

- Write in natural, easy-to-understand Hindi.

- Every item must be original.

- Do not copy articles, websites, poems or other copyrighted text.

- Do not invent news, facts, quotes, people, dates or statistics.

- Do not create political persuasion or political propaganda.

- Keep jokes clean and family-friendly.

- Keep shayari original.

- Keep bhakti content respectful.

- Keep knowledge useful and factually reliable.

- Keep technology content useful for normal smartphone users.

- Keep gaming content useful for gamers.

- Keep entertainment content general and family-friendly.

- Blog items should contain useful information, not just a headline.

- Do not return Markdown.

- Return JSON only.
  `;
  
        const response = await fetch(
        "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-goog-api-key": apiKey
          },
          body: JSON.stringify({
            contents: [
              {
                parts: [
                  {
                    text: prompt
                  }
                ]
              }
            ],
            generationConfig: {
              temperature: 0.8,
              responseMimeType: "application/json"
            }
          })
        }
      );

      const responseText = await response.text();

      if (!response.ok) {
        console.error("Gemini API error:");
        console.error(responseText);
        process.exit(1);
      }

      let data;

      try {
        data = JSON.parse(responseText);
      } catch (error) {
        console.error("Gemini returned invalid API JSON.");
        console.error(responseText);
        process.exit(1);
      }

      const text =
        data?.candidates?.[0]?.content?.parts?.[0]?.text;

      if (!text) {
        console.error("Gemini returned no content.");
        console.error(JSON.stringify(data, null, 2));
        process.exit(1);
      }

      let content;

      try {
        content = JSON.parse(text);
      } catch (error) {
        console.error("Gemini content was not valid JSON.");
        console.error(text);
        process.exit(1);
      }

      const categories = [
        "jokes",
        "shayari",
        "bhakti",
        "knowledge",
        "technology",
        "gaming",
        "entertainment",
        "blog"
      ];

      for (const category of categories) {
        if (!Array.isArray(content[category])) {
          console.error(
            `Invalid category: ${category}`
          );
          process.exit(1);
        }

        if (content[category].length !== 3) {
          console.error(
            `${category} must contain exactly 3 items.`
          );
          process.exit(1);
        }
      }

      fs.mkdirSync("content", { recursive: true });

      fs.writeFileSync(
        "content/auto-content.json",
        JSON.stringify(content, null, 2),
        "utf8"
      );

      console.log(
        "GAMEZONE ARENA daily content generated successfully."
      );
    }

    main().catch((error) => {
      console.error("Generation failed:");
      console.error(error);
      process.exit(1);
    });
    NODE

- name: Commit generated content
  run: |
    git config user.name "github-actions[bot]"
    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    git add content/auto-content.json

    if git diff --cached --quiet; then
      echo "No content changes to commit."
    else
      git commit -m "Update daily GAMEZONE ARENA content"
      git push
    fi
