name: GAMEZONE ARENA Auto Content

on:
  schedule:
    - cron: "45 3 * * *"

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const key = process.env.GEMINI_API_KEY;

          if (!key) {
            throw new Error("GEMINI_API_KEY secret is missing.");
          }

          const newsUrl =
            "https://news.google.com/rss?hl=hi&gl=IN&ceid=IN:hi";

          async function main() {
            const newsResponse = await fetch(newsUrl);

            let newsText = "";

            if (newsResponse.ok) {
              newsText = await newsResponse.text();
            }

            const prompt = `
GAMEZONE ARENA वेबसाइट के लिए आज के 20 नए मौलिक हिंदी content items बनाइए।

मुख्य नियम:
- EXACTLY 20 items दें।
- हर item पूरा readable होना चाहिए।
- केवल headline या छोटा snippet नहीं।
- jokes, shayari, bhakti, knowledge, news, mobile, Android, internet, AI, technology, gaming, Ludo, cricket, blogging, how-to, entertainment और trending topics में variety रखें।
- jokes में setup और punchline दें।
- shayari पूरी दें।
- how-to में step-by-step जानकारी दें।
- news में केवल उपलब्ध source information का उपयोग करें।
- news में कोई नाम, तारीख, संख्या, quote या तथ्य invent न करें।
- fake news नहीं।
- fake quotes नहीं।
- political persuasion नहीं।
- copyrighted content copy नहीं।
- प्रसिद्ध भजन के पूरे lyrics copy नहीं।
- health या finance में guaranteed claims नहीं।
- सभी content family-friendly और सरल हिंदी में हो।
- हर item में title, content, keywords, seoTitle, metaDescription और sourceNote दें।
- original content के लिए sourceNote "मौलिक सामग्री" रखें।
- news के लिए sourceNote "Google News headlines से topic लिया गया" रखें।

CURRENT GOOGLE NEWS DATA:

${newsText.slice(0, 30000)}

केवल valid JSON लौटाएं:

{
  "items": [
    {
      "type": "news",
      "title": "शीर्षक",
      "category": "General",
      "content": "पूरा readable content",
      "keywords": ["हिंदी", "जानकारी", "आज"],
      "seoTitle": "SEO title",
      "metaDescription": "SEO description",
      "sourceNote": "मौलिक सामग्री"
    }
  ]
}
`;

            const models = [
              "gemini-3.5-flash-lite",
              "gemini-2.5-flash-lite",
              "gemini-2.5-flash"
            ];

            let result = null;

            for (const model of models) {
              const url =
                "https://generativelanguage.googleapis.com/v1beta/models/" +
                model +
                ":generateContent";

              const response = await fetch(url, {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "x-goog-api-key": key
                },
                body: JSON.stringify({
                  contents: [
                    {
                      parts: [
                        {
                          text: prompt
                        }
                      ]
                    }
                  ],
                  generationConfig: {
                    temperature: 0.8,
                    responseMimeType: "application/json"
                  }
                })
              });

              const data = await response.json();

              if (response.ok) {
                result = data;
                break;
              }

              console.log(
                "Model failed:",
                model,
                response.status
              );
            }

            if (!result) {
              throw new Error(
                "All Gemini models failed."
              );
            }

            const text =
              result?.candidates?.[0]?.content?.parts?.[0]?.text;

            if (!text) {
              throw new Error(
                "Gemini returned no content."
              );
            }

            let parsed;

            try {
              parsed = JSON.parse(text);
            } catch {
              const start = text.indexOf("{");
              const end = text.lastIndexOf("}");

              if (start === -1 || end === -1) {
                throw new Error(
                  "Gemini returned invalid JSON."
                );
              }

              parsed = JSON.parse(
                text.slice(start, end + 1)
              );
            }

            if (
              !parsed ||
              !Array.isArray(parsed.items)
            ) {
              throw new Error(
                "No items array returned."
              );
            }

            const newItems =
              parsed.items
                .slice(0, 20)
                .filter(
                  item =>
                    item &&
                    item.title &&
                    item.content
                )
                .map(item => ({
                  type: String(
                    item.type || "blog"
                  ),

                  title: String(
                    item.title
                  ),

                  category: String(
                    item.category || "General"
                  ),

                  content: String(
                    item.content
                  ),

                  keywords:
                    Array.isArray(item.keywords)
                      ? item.keywords
                          .map(String)
                          .slice(0, 8)
                      : [],

                  seoTitle: String(
                    item.seoTitle ||
                    item.title
                  ),

                  metaDescription: String(
                    item.metaDescription ||
                    item.content
                  ).slice(0, 160),

                  sourceNote: String(
                    item.sourceNote ||
                    "मौलिक सामग्री"
                  ),

                  generatedAt:
                    new Date().toISOString()
                }));

            fs.mkdirSync(
              "content",
              {
                recursive: true
              }
            );

            const file =
              "content/auto-content.json";

            let oldItems = [];

            if (fs.existsSync(file)) {
              try {
                const old =
                  JSON.parse(
                    fs.readFileSync(
                      file,
                      "utf8"
                    )
                  );

                if (Array.isArray(old)) {
                  oldItems = old;
                } else if (
                  Array.isArray(old.items)
                ) {
                  oldItems = old.items;
                }
              } catch {
                oldItems = [];
              }
            }

            const finalItems = [
              ...newItems,
              ...oldItems
            ].slice(0, 300);

            fs.writeFileSync(
              file,
              JSON.stringify(
                finalItems,
                null,
                2
              ),
              "utf8"
            );

            console.log(
              "New items:",
              newItems.length
            );

            console.log(
              "Total items:",
              finalItems.length
            );
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit content
        run: |
          git config user.name "GAMEZONE ARENA Auto Content"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/auto-content.json

          if git diff --cached --quiet; then
            echo "No new content."
            exit 0
          fi

          git commit -m "Update GAMEZONE ARENA daily content"
          git push
