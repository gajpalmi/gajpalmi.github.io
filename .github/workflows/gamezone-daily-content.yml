name: GAMEZONE ARENA Daily Hindi Content

on:
  workflow_dispatch:

  schedule:
    # रोज सुबह 9:15 बजे भारत के समय
    # 09:15 IST = 03:45 UTC
    - cron: "45 3 * * *"

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Daily Hindi Content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > /tmp/generate-content.mjs <<'EOF'
          import fs from "fs";

          const API_KEY = process.env.GEMINI_API_KEY;

          if (!API_KEY) {
            throw new Error("GEMINI_API_KEY secret is missing.");
          }

          const NEWS_RSS =
            "https://news.google.com/rss?hl=hi&gl=IN&ceid=IN:hi";

          const SITE_URL = "https://gajpalmi.github.io";

          function decodeHtml(text) {
            return String(text)
              .replace(/<!\[CDATA\[(.*?)\]\]>/gs, "$1")
              .replace(/&amp;/g, "&")
              .replace(/&quot;/g, '"')
              .replace(/&#39;/g, "'")
              .replace(/&lt;/g, "<")
              .replace(/&gt;/g, ">");
          }

          function escapeHtml(value) {
            return String(value ?? "")
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&#039;");
          }

          function escapeXml(value) {
            return String(value ?? "")
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&apos;");
          }

          function cleanJson(text) {
            return String(text ?? "")
              .replace(/^```json\s*/i, "")
              .replace(/^```\s*/i, "")
              .replace(/\s*```$/i, "")
              .trim();
          }

          function slugify(text) {
            const slug = String(text ?? "")
              .trim()
              .toLowerCase()
              .replace(/[^\p{L}\p{N}]+/gu, "-")
              .replace(/^-+|-+$/g, "")
              .slice(0, 80);

            return slug || "gamezone-arena-content";
          }

          async function getCurrentNews() {
            try {
              const response = await fetch(NEWS_RSS);

              if (!response.ok) {
                throw new Error(
                  `Google News RSS HTTP ${response.status}`
                );
              }

              const xml = await response.text();

              const titles = [
                ...xml.matchAll(/<title>(.*?)<\/title>/gis)
              ]
                .map((match) => decodeHtml(match[1]).trim())
                .filter(Boolean)
                .slice(1, 21);

              return titles;
            } catch (error) {
              console.log(
                "Google News RSS unavailable:",
                error.message
              );

              return [];
            }
          }

          async function generateWithGemini(newsTitles) {
            const now = new Date();

            const newsContext =
              newsTitles.length > 0
                ? newsTitles
                    .map((title, index) => `${index + 1}. ${title}`)
                    .join("\n")
                : "आज Google News headlines उपलब्ध नहीं हैं।";

            const prompt = `
तुम GAMEZONE ARENA वेबसाइट के लिए professional Hindi content editor हो।

आज की तारीख और समय:
${now.toISOString()}

भारत के Google News Hindi RSS से मिले current topic headlines:

${newsContext}

तुम्हारा काम GAMEZONE ARENA वेबसाइट के लिए रोज नई, मौलिक,
उपयोगी और पढ़ने योग्य Hindi सामग्री तैयार करना है।

मुख्य नियम:

1. मुख्य भाषा Hindi Devanagari हो।
2. English technical terms केवल जहाँ जरूरी हों वहीं रखें।
3. किसी दूसरी वेबसाइट का article copy मत करो।
4. Google News headlines को केवल current topic idea की तरह इस्तेमाल करो।
5. Headline में दी गई जानकारी से आगे कोई specific news fact मत गढ़ो।
6. अगर किसी current news की पर्याप्त जानकारी उपलब्ध नहीं है,
   तो उसे current-topic explainer की तरह लिखो।
7. झूठे claims मत बनाओ।
8. Clickbait मत बनाओ।
9. एक ही विषय को बार-बार अलग शब्दों में repeat मत करो।
10. सामग्री सामान्य इंटरनेट users के लिए आसान भाषा में हो।
11. Health category में केवल सामान्य educational/lifestyle information दो।
12. Medical diagnosis या व्यक्तिगत medical advice मत दो।
13. Cybersecurity content awareness और safety education पर आधारित हो।
14. Gaming content legal और सामान्य gaming information पर आधारित हो।
15. News article में uncertainty हो तो उसे स्पष्ट रूप से बताओ।

लगभग 20 नए items बनाओ।

इन विषयों को मिलाकर cover करो:

- jokes
- shayari
- bhakti
- bhajan
- kirtan
- knowledge
- facts
- motivation
- technology
- mobile
- Android
- Google
- internet
- AI
- gaming
- apps
- social-media
- entertainment
- cricket
- sports
- education
- health-and-lifestyle
- tips
- how-to
- blogging
- digital
- cybersecurity-awareness
- current-news
- trending-topics
- dialogue
- family
- festival
- interesting-facts

विशेष रूप से ऐसे topics चुनो जिन्हें लोग internet पर खोजते हैं:

- कैसे करें
- क्या है
- क्यों होता है
- मोबाइल में कैसे करें
- Android में कैसे करें
- Google में कैसे करें
- AI कैसे इस्तेमाल करें
- AI tools
- Internet tips
- Mobile tips
- Android tips
- Google tips
- Gaming tips
- Blogging tips
- YouTube basics
- Social media tips
- Digital safety
- Online safety
- Technology explainers

हर item में ये fields जरूरी हैं:

{
  "type": "",
  "category": "",
  "title": "",
  "slug": "",
  "excerpt": "",
  "content": "",
  "readMoreContent": "",
  "keywords": [],
  "seoTitle": "",
  "metaDescription": "",
  "sourceNote": "",
  "datePublished": ""
}

Content quality:

title:
छोटा, स्पष्ट और आकर्षक हो।

excerpt:
1-2 lines का summary हो।

content:
मुख्य छोटा article हो।

readMoreContent:
पूरा विस्तृत article हो।

readMoreContent में जरूरत के अनुसार शामिल करो:

- परिचय
- मुख्य जानकारी
- आसान explanation
- examples
- practical tips
- सावधानियाँ
- conclusion

keywords:
5 से 10 natural Hindi/English search phrases।

seoTitle:
लगभग 50-60 characters के आसपास।

metaDescription:
लगभग 120-160 characters।

datePublished:
आज की date/time।

sourceNote:

Evergreen content:
"मौलिक सामग्री"

Current news/current topic:
"Google News India के current topic से प्रेरित"

News headline को verbatim article की तरह copy मत करो।

महत्वपूर्ण:

सभी articles अलग-अलग और genuinely useful हों।

Jokes में original jokes बनाओ।
Shayari में original shayari बनाओ।
Bhakti में original devotional content बनाओ।
Knowledge में educational facts/explainers बनाओ।
Technology में practical information दो।
Mobile/Android में useful tips दो।
AI में आसान और practical information दो।
Gaming में useful gaming tips/information दो।
Blogging में beginners के लिए useful information दो।

अंत में केवल valid JSON array दो।

कोई markdown नहीं।
कोई ```json नहीं।
कोई अतिरिक्त explanation नहीं।
`;

            const url =
              "https://generativelanguage.googleapis.com/v1beta/models/" +
              "gemini-3.5-flash-lite:generateContent?key=" +
              encodeURIComponent(API_KEY);

            const response = await fetch(url, {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                contents: [
                  {
                    parts: [
                      {
                        text: prompt
                      }
                    ]
                  }
                ],
                generationConfig: {
                  temperature: 0.8,
                  maxOutputTokens: 20000,
                  responseMimeType: "application/json"
                }
              })
            });

            const raw = await response.text();

            if (!response.ok) {
              throw new Error(
                `Gemini API ${response.status}: ${raw}`
              );
            }

            const data = JSON.parse(raw);

            const text =
              data?.candidates?.[0]?.content?.parts
                ?.map((part) => part.text || "")
                .join("")
                .trim();

            if (!text) {
              throw new Error(
                "Gemini returned empty content."
              );
            }

            const cleaned = cleanJson(text);

            let result;

            try {
              result = JSON.parse(cleaned);
            } catch (error) {
              console.log("Gemini raw output:");
              console.log(cleaned);

              throw new Error(
                "Gemini response was not valid JSON."
              );
            }

            return result;
          }

          function createArticleHtml(item) {
            const articleUrl =
              `${SITE_URL}/articles/${item.slug}/`;

            const articleType =
              item.type === "current-news" ||
              item.type === "news"
                ? "NewsArticle"
                : "BlogPosting";

            const jsonLd = {
              "@context": "https://schema.org",
              "@type": articleType,
              "headline": item.title,
              "description": item.metaDescription,
              "datePublished": item.datePublished,
              "dateModified": item.datePublished,
              "inLanguage": "hi-IN",
              "author": {
                "@type": "Organization",
                "name": "GAMEZONE ARENA"
              },
              "publisher": {
                "@type": "Organization",
                "name": "GAMEZONE ARENA"
              },
              "mainEntityOfPage": {
                "@type": "WebPage",
                "@id": articleUrl
              }
            };

            return `<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>${escapeHtml(item.seoTitle)}</title>

<meta
  name="description"
  content="${escapeHtml(item.metaDescription)}"
>

<meta
  name="robots"
  content="index,follow"
>

<link
  rel="canonical"
  href="${escapeHtml(articleUrl)}"
>

<script type="application/ld+json">
${JSON.stringify(jsonLd, null, 2)}
</script>

<style>
body {
  margin: 0;
  padding: 0;
  background: #0b0f14;
  color: #ffffff;
  font-family: Arial, sans-serif;
  line-height: 1.8;
}

article {
  max-width: 850px;
  margin: auto;
  padding: 25px;
}

h1 {
  line-height: 1.35;
}

.meta {
  opacity: 0.7;
  font-size: 14px;
  margin-bottom: 20px;
}

.excerpt {
  font-size: 18px;
  line-height: 1.7;
  margin: 20px 0;
}

.content {
  white-space: pre-wrap;
  font-size: 17px;
}

a {
  color: #5de6ff;
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

hr {
  margin: 35px 0;
  opacity: 0.2;
}
</style>
</head>

<body>

<article>

<p>
<a href="${SITE_URL}/">
← GAMEZONE ARENA पर वापस जाएँ
</a>
</p>

<h1>${escapeHtml(item.title)}</h1>

<div class="meta">
${escapeHtml(item.category)}
·
${escapeHtml(item.datePublished)}
</div>

<div class="excerpt">
${escapeHtml(item.excerpt)}
</div>

<div class="content">
${escapeHtml(item.readMoreContent)}
</div>

<hr>

<p>
${escapeHtml(item.sourceNote)}
</p>

<p>
© GAMEZONE ARENA
</p>

</article>

</body>
</html>`;
          }

          async function main() {
            console.log(
              "Starting GAMEZONE ARENA daily content generation..."
            );

            const newsTitles = await getCurrentNews();

            console.log(
              `Current Google News topics found: ${newsTitles.length}`
            );

            const generated =
              await generateWithGemini(newsTitles);

            if (
              !Array.isArray(generated) ||
              generated.length === 0
            ) {
              throw new Error(
                "Generated content is empty."
              );
            }

            const now = new Date();

            const items = generated
              .slice(0, 25)
              .map((item, index) => {
                const title =
                  String(item?.title || "")
                    .trim() ||
                  `GAMEZONE ARENA Hindi Content ${index + 1}`;

                const baseSlug =
                  slugify(item?.slug || title);

                const slug =
                  `${baseSlug}-${now.getTime()}-${index + 1}`;

                const content =
                  String(item?.content || "").trim();

                const readMoreContent =
                  String(
                    item?.readMoreContent || content
                  ).trim();

                const keywords =
                  Array.isArray(item?.keywords)
                    ? item.keywords
                        .map((keyword) =>
                          String(keyword).trim()
                        )
                        .filter(Boolean)
                        .slice(0, 10)
                    : [];

                return {
                  type:
                    String(
                      item?.type || "knowledge"
                    ).trim(),

                  category:
                    String(
                      item?.category || "Hindi"
                    ).trim(),

                  title,

                  slug,

                  excerpt:
                    String(
                      item?.excerpt || ""
                    ).trim(),

                  content,

                  readMoreContent,

                  keywords,

                  seoTitle:
                    String(
                      item?.seoTitle || title
                    ).trim(),

                  metaDescription:
                    String(
                      item?.metaDescription ||
                      item?.excerpt ||
                      title
                    ).trim(),

                  sourceNote:
                    String(
                      item?.sourceNote ||
                      "मौलिक सामग्री"
                    ).trim(),

                  datePublished:
                    now.toISOString()
                };
              });

            if (items.length === 0) {
              throw new Error(
                "No usable content items generated."
              );
            }

            const contentDir = "content";

            fs.mkdirSync(contentDir, {
              recursive: true
            });

            const contentFile =
              `${contentDir}/auto-content.json`;

            let existing = [];

            if (fs.existsSync(contentFile)) {
              try {
                const oldData = JSON.parse(
                  fs.readFileSync(
                    contentFile,
                    "utf8"
                  )
                );

                if (Array.isArray(oldData)) {
                  existing = oldData;
                } else if (
                  Array.isArray(oldData.items)
                ) {
                  existing = oldData.items;
                }
              } catch (error) {
                console.log(
                  "Existing content JSON could not be parsed."
                );

                existing = [];
              }
            }

            const merged = [
              ...items,
              ...existing
            ];

            const finalItems =
              merged.slice(0, 300);

            const output = {
              generatedAt:
                now.toISOString(),

              count:
                finalItems.length,

              items:
                finalItems
            };

            fs.writeFileSync(
              contentFile,
              JSON.stringify(
                output,
                null,
                2
              ),
              "utf8"
            );

            console.log(
              `Saved ${finalItems.length} items to ${contentFile}`
            );

            const articlesDir =
              "articles";

            fs.mkdirSync(
              articlesDir,
              {
                recursive: true
              }
            );

            const articleUrls = [];

            for (const item of items) {
              const articleDir =
                `${articlesDir}/${item.slug}`;

              fs.mkdirSync(
                articleDir,
                {
                  recursive: true
                }
              );

              const articleUrl =
                `${SITE_URL}/articles/${item.slug}/`;

              articleUrls.push(
                articleUrl
              );

              const html =
                createArticleHtml(item);

              fs.writeFileSync(
                `${articleDir}/index.html`,
                html,
                "utf8"
              );
            }

            console.log(
              `Created ${articleUrls.length} article pages.`
            );

            const sitemapUrls = [
              `${SITE_URL}/`,
              ...articleUrls
            ];

            const sitemap =
              `<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
${sitemapUrls
  .map(
    (url) => `
  <url>
    <loc>${escapeXml(url)}</loc>
    <lastmod>${now.toISOString()}</lastmod>
  </url>`
  )
  .join("")}
</urlset>
`;

            fs.writeFileSync(
              "sitemap.xml",
              sitemap,
              "utf8"
            );

            const robots =
              `User-agent: *
Allow: /

Sitemap: ${SITE_URL}/sitemap.xml
`;

            fs.writeFileSync(
              "robots.txt",
              robots,
              "utf8"
            );

            console.log(
              "sitemap.xml created."
            );

            console.log(
              "robots.txt created."
            );

            console.log(
              "GAMEZONE ARENA daily content generation completed successfully."
            );
          }

          main().catch((error) => {
            console.error(
              "WORKFLOW ERROR:"
            );

            console.error(error);

            process.exit(1);
          });
          EOF

          node /tmp/generate-content.mjs

      - name: Commit and push generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/auto-content.json
          git add articles
          git add sitemap.xml
          git add robots.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "auto: update daily Hindi content and SEO pages"

          git push
