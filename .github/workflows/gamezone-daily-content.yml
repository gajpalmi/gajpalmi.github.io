name: GAMEZONE ARENA Daily Hindi Content

"on":
  schedule:
    - cron: "45 3 * * *"

permissions:
  contents: write

concurrency:
  group: gamezone-arena-daily-content
  cancel-in-progress: false

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate and save daily Hindi content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const API_KEY = process.env.GEMINI_API_KEY;

          if (!API_KEY) {
            console.error("GEMINI_API_KEY secret is missing.");
            process.exit(1);
          }

          const MODEL = "gemini-3.5-flash-lite";

          const API_URL =
            `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`;

          const NEWS_URL =
            "https://news.google.com/rss?hl=hi&gl=IN&ceid=IN:hi";

          const CONTENT_FILE =
            "content/auto-content.json";

          function cleanText(text) {
            return String(text || "")
              .replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g, "$1")
              .replace(/<br\s*\/?>/gi, " ")
              .replace(/<[^>]*>/g, " ")
              .replace(/&amp;/g, "&")
              .replace(/&quot;/g, '"')
              .replace(/&#39;/g, "'")
              .replace(/&lt;/g, "<")
              .replace(/&gt;/g, ">")
              .replace(/&#(\d+);/g, (_, n) => {
                try {
                  return String.fromCodePoint(Number(n));
                } catch {
                  return "";
                }
              })
              .replace(/\s+/g, " ")
              .trim();
          }

          function escapeHtml(text) {
            return String(text || "")
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&#39;");
          }

          function stripMarkdown(text) {
            return String(text || "")
              .replace(/```[\s\S]*?```/g, " ")
              .replace(/\*\*/g, "")
              .replace(/__/g, "")
              .replace(/#+\s?/g, "")
              .replace(/\s+/g, " ")
              .trim();
          }

          function makeMetaDescription(text) {
            return stripMarkdown(text)
              .slice(0, 155)
              .trim();
          }

          function makeSlug(title, index) {
            const transliterated = String(title || "")
              .toLowerCase()
              .replace(/[^\p{L}\p{N}]+/gu, "-")
              .replace(/^-+|-+$/g, "")
              .slice(0, 70);

            return (
              transliterated ||
              `gamezone-content-${Date.now()}-${index}`
            );
          }

          async function getCurrentNews() {
            console.log("================================");
            console.log("GETTING CURRENT GOOGLE NEWS");
            console.log("================================");

            try {
              const response = await fetch(NEWS_URL, {
                headers: {
                  "User-Agent":
                    "GAMEZONE-ARENA-Auto-Content/1.0"
                }
              });

              if (!response.ok) {
                console.log(
                  `Google News RSS unavailable: ${response.status}`
                );
                return [];
              }

              const xml = await response.text();

              const items = [];

              const matches =
                xml.matchAll(
                  /<item>([\s\S]*?)<\/item>/gi
                );

              for (const match of matches) {
                const block = match[1];

                const titleMatch =
                  block.match(
                    /<title>([\s\S]*?)<\/title>/i
                  );

                const descriptionMatch =
                  block.match(
                    /<description>([\s\S]*?)<\/description>/i
                  );

                const linkMatch =
                  block.match(
                    /<link>([\s\S]*?)<\/link>/i
                  );

                const pubDateMatch =
                  block.match(
                    /<pubDate>([\s\S]*?)<\/pubDate>/i
                  );

                const title =
                  cleanText(
                    titleMatch
                      ? titleMatch[1]
                      : ""
                  );

                const description =
                  cleanText(
                    descriptionMatch
                      ? descriptionMatch[1]
                      : ""
                  );

                const link =
                  cleanText(
                    linkMatch
                      ? linkMatch[1]
                      : ""
                  );

                const pubDate =
                  cleanText(
                    pubDateMatch
                      ? pubDateMatch[1]
                      : ""
                  );

                if (!title) {
                  continue;
                }

                const exists =
                  items.some(
                    item =>
                      item.title === title
                  );

                if (exists) {
                  continue;
                }

                items.push({
                  title,
                  description,
                  link,
                  pubDate
                });

                if (items.length >= 15) {
                  break;
                }
              }

              console.log(
                `Current news items found: ${items.length}`
              );

              return items;
            } catch (error) {
              console.log(
                "Could not load Google News RSS."
              );

              console.log(
                error.message
              );

              return [];
            }
          }

          async function generateContent(news) {
            const newsContext =
              news.length > 0
                ? news
                    .map(
                      (item, index) =>
                        `
NEWS ${index + 1}
Title: ${item.title}
Description: ${item.description || "उपलब्ध नहीं"}
Source URL: ${item.link || "उपलब्ध नहीं"}
Published: ${item.pubDate || "उपलब्ध नहीं"}
`
                    )
                    .join("\n")
                : `
आज Google News RSS से current news उपलब्ध नहीं हुई।
Current news invent मत करें।
बाकी evergreen original content तैयार करें।
`;

            const prompt = `
आप GAMEZONE ARENA वेबसाइट के लिए रोज़ नई,
मौलिक, विस्तृत और उपयोगी हिंदी सामग्री तैयार
करने वाले professional automatic content editor हैं।

आज की तारीख के लिए लगभग 20 अलग-अलग content items
तैयार करें।

सभी user-facing सामग्री मुख्य रूप से सरल,
स्वाभाविक और साफ हिंदी देवनागरी में हो।

Brand name, app name, website name और जरूरी
technical terms English में रह सकते हैं।

==================================================
CURRENT GOOGLE NEWS CONTEXT
==================================================

नीचे Google News India Hindi RSS से प्राप्त current
topics दिए गए हैं।

इनका उपयोग केवल current topic/context समझने के लिए करें।

${newsContext}

==================================================
CONTENT TYPES
==================================================

सामग्री में variety अनिवार्य है।

इन विषयों को मिलाकर content तैयार करें:

1. हिंदी चुटकुले
2. मजेदार संवाद
3. सुविचार
4. हिंदी शायरी
5. प्रेम शायरी
6. दोस्ती शायरी
7. जीवन शायरी
8. मोटिवेशनल विचार
9. भक्ति
10. भजन
11. कीर्तन
12. आध्यात्मिक जानकारी
13. ज्ञान
14. सामान्य ज्ञान
15. हिंदी current-topic news
16. Mobile और Android
17. Internet और online safety
18. AI
19. Google
20. Technology
21. Apps
22. Gadgets
23. Gaming
24. Ludo
25. Cricket gaming
26. Gaming tips
27. Blogging
28. SEO
29. Website tips
30. How-to guides
31. Entertainment
32. Trending topics

हर दिन सभी प्रकार के items बनाना जरूरी नहीं है,
लेकिन रोज़ variety होनी चाहिए।

==================================================
FULL CONTENT REQUIREMENT
==================================================

IMPORTANT:

सिर्फ headline मत लौटाइए।

हर item में ऐसा पूरा content दें जिसे वेबसाइट पर
Read More खोलने के बाद उपयोगकर्ता आराम से पढ़ सके।

छोटे items:

Joke / dialogue / short shayari:
लगभग 80 से 180 शब्द तक।

Knowledge / GK / devotional / tips:
लगभग 250 से 450 शब्द तक।

How-to / technology / mobile / AI / gaming:
लगभग 350 से 650 शब्द तक।

Blog / current-topic article:
लगभग 450 से 800 शब्द तक,
जब उपलब्ध जानकारी इसकी अनुमति दे।

News:

केवल headline नहीं।

उपलब्ध current headline और RSS description से
एक विस्तृत लेकिन factual Hindi news summary/article
तैयार करें।

News में यह structure उपयोग कर सकते हैं:

- मुख्य विषय
- क्या जानकारी उपलब्ध है
- headline/context का सरल explanation
- उपलब्ध facts
- इसका सामान्य महत्व
- readers के लिए क्या समझना जरूरी है

लेकिन source में जो जानकारी उपलब्ध नहीं है,
उसे invent नहीं करना है।

==================================================
NEWS SAFETY
==================================================

1. Fake news मत बनाएं।

2. Current news में केवल दिए गए RSS headline,
description और उपलब्ध source information से topic लें।

3. Headline से आगे unsupported facts मत जोड़ें।

4. किसी व्यक्ति, संस्था या कंपनी पर बिना आधार
   आरोप मत लगाएं।

5. राजनीतिक persuasion मत करें।

6. राजनीतिक विषय हो तो neutral factual language रखें।

7. चुनाव, नेता या राजनीतिक घटनाओं पर अपनी राय,
   ranking या persuasion मत दें।

8. Health, medicine, money, investment या financial
   विषय में guaranteed claims मत करें।

9. यदि headline पर्याप्त जानकारी नहीं देती,
   तो साफ बताएं कि उपलब्ध जानकारी सीमित है।

10. किसी दूसरे website के article को copy मत करें।

11. किसी copyrighted article को लगभग उसी रूप में
    rewrite मत करें।

12. पूरा external article reproduce मत करें।

13. News article मौलिक summary/explanation होना चाहिए।

==================================================
ORIGINAL CONTENT RULES
==================================================

1. सभी jokes original हों।

2. सभी shayari original हों।

3. भक्ति content respectful और original हो।

4. भजन/कीर्तन की पूरी copyrighted lyrics copy मत करें।

5. प्रसिद्ध व्यक्ति के नाम से fake quote मत बनाएं।

6. Knowledge/GK में गलत facts न लिखें।

7. एक ही content या idea repeat मत करें।

8. Family-friendly content रखें।

9. भाषा सरल रखें।

10. Practical और उपयोगी जानकारी दें।

11. How-to content step-by-step हो।

12. Blog content पर्याप्त विस्तार से हो।

13. हर item दूसरे item से अलग हो।

==================================================
SEO
==================================================

हर item में:

- SEO-friendly title
- 3 से 8 useful keywords
- छोटा meta description
- sourceNote

देना अनिवार्य है।

==================================================
SOURCE NOTE
==================================================

Current/news/trending:

"Google News India के current topic से प्रेरित"

Original:

"मौलिक सामग्री"

Knowledge/tips/how-to/blog:

"मौलिक सामग्री"

SourceNote में fake URL मत बनाएं।

==================================================
OUTPUT
==================================================

EXACTLY 20 items लौटाएं।

JSON के अलावा कोई text मत लौटाएं।

Markdown मत लौटाएं।

JSON format:

{
  "items": [
    {
      "type": "news",
      "title": "पूरा हिंदी शीर्षक",
      "category": "India",
      "content": "पूरा विस्तृत content",
      "keywords": [
        "हिंदी न्यूज़",
        "आज की खबर",
        "current news"
      ],
      "seoTitle": "SEO friendly title",
      "metaDescription": "छोटा SEO description",
      "sourceNote": "Google News India के current topic से प्रेरित",
      "sourceUrl": "https://example.com"
    }
  ]
}
`;

            const body = {
              contents: [
                {
                  parts: [
                    {
                      text: prompt
                    }
                  ]
                }
              ],

              generationConfig: {
                temperature: 0.85,

                responseMimeType:
                  "application/json",

                responseSchema: {
                  type: "OBJECT",

                  properties: {
                    items: {
                      type: "ARRAY",

                      items: {
                        type: "OBJECT",

                        properties: {
                          type: {
                            type: "STRING"
                          },

                          title: {
                            type: "STRING"
                          },

                          category: {
                            type: "STRING"
                          },

                          content: {
                            type: "STRING"
                          },

                          keywords: {
                            type: "ARRAY",

                            items: {
                              type: "STRING"
                            }
                          },

                          seoTitle: {
                            type: "STRING"
                          },

                          metaDescription: {
                            type: "STRING"
                          },

                          sourceNote: {
                            type: "STRING"
                          },

                          sourceUrl: {
                            type: "STRING"
                          }
                        },

                        required: [
                          "type",
                          "title",
                          "category",
                          "content",
                          "keywords",
                          "seoTitle",
                          "metaDescription",
                          "sourceNote",
                          "sourceUrl"
                        ]
                      }
                    }
                  },

                  required: [
                    "items"
                  ]
                }
              }
            };

            console.log(
              "Sending content generation request to Gemini..."
            );

            const response =
              await fetch(
                API_URL,
                {
                  method: "POST",

                  headers: {
                    "Content-Type":
                      "application/json",

                    "x-goog-api-key":
                      API_KEY
                  },

                  body:
                    JSON.stringify(body)
                }
              );

            const result =
              await response.json();

            if (!response.ok) {
              console.error(
                "Gemini API request failed."
              );

              console.error(
                JSON.stringify(
                  result,
                  null,
                  2
                )
              );

              process.exit(1);
            }

            const text =
              result
                ?.candidates?.[0]
                ?.content?.parts?.[0]
                ?.text;

            if (!text) {
              console.error(
                "Gemini returned no content."
              );

              console.error(
                JSON.stringify(
                  result,
                  null,
                  2
                )
              );

              process.exit(1);
            }

            let parsed;

            try {
              parsed =
                JSON.parse(text);
            } catch (error) {
              console.error(
                "Gemini returned invalid JSON."
              );

              console.error(text);

              process.exit(1);
            }

            if (
              !parsed ||
              !Array.isArray(
                parsed.items
              )
            ) {
              console.error(
                "Gemini response does not contain items array."
              );

              process.exit(1);
            }

            return parsed.items;
          }

          async function main() {
            console.log("");
            console.log("================================");
            console.log("GAMEZONE ARENA");
            console.log("DAILY HINDI CONTENT SYSTEM");
            console.log("================================");
            console.log("");

            const news =
              await getCurrentNews();

            const generated =
              await generateContent(
                news
              );

            const allowedTypes =
              new Set([
                "jokes",
                "shayari",
                "bhakti",
                "knowledge",
                "news",
                "technology",
                "mobile",
                "gaming",
                "entertainment",
                "dialogue",
                "internet",
                "ai",
                "tips",
                "blog"
              ]);

            const cleanItems =
              generated
                .filter(
                  item =>
                    item &&
                    typeof item.title ===
                      "string" &&
                    typeof item.content ===
                      "string"
                )
                .map(
                  (item, index) => {
                    const type =
                      String(
                        item.type || ""
                      )
                        .trim()
                        .toLowerCase();

                    const safeType =
                      allowedTypes.has(type)
                        ? type
                        : "blog";

                    const title =
                      String(
                        item.title || ""
                      ).trim();

                    const content =
                      String(
                        item.content || ""
                      ).trim();

                    const keywords =
                      Array.isArray(
                        item.keywords
                      )
                        ? item.keywords
                            .map(
                              x =>
                                String(
                                  x
                                ).trim()
                            )
                            .filter(Boolean)
                            .slice(0, 8)
                        : [];

                    let sourceUrl =
                      String(
                        item.sourceUrl || ""
                      ).trim();

                    if (
                      !/^https?:\/\//i.test(
                        sourceUrl
                      )
                    ) {
                      sourceUrl = "";
                    }

                    return {
                      type: safeType,

                      title,

                      category:
                        String(
                          item.category ||
                            "General"
                        ).trim(),

                      content,

                      keywords,

                      seoTitle:
                        String(
                          item.seoTitle ||
                            title
                        ).trim(),

                      metaDescription:
                        String(
                          item.metaDescription ||
                            makeMetaDescription(
                              content
                            )
                        )
                          .trim()
                          .slice(0, 160),

                      sourceNote:
                        String(
                          item.sourceNote ||
                            (
                              safeType ===
                                "news"
                                ? "Google News India के current topic से प्रेरित"
                                : "मौलिक सामग्री"
                            )
                        ).trim(),

                      sourceUrl,

                      generatedAt:
                        new Date()
                          .toISOString(),

                      contentId:
                        `${Date.now()}-${index}-${makeSlug(
                          title,
                          index
                        )}`
                    };
                  }
                )
                .filter(
                  item =>
                    item.title &&
                    item.content
                );

            if (
              cleanItems.length === 0
            ) {
              console.error(
                "No valid content was generated."
              );

              process.exit(1);
            }

            /*
             * READ EXISTING CONTENT
             */

            fs.mkdirSync(
              "content",
              {
                recursive: true
              }
            );

            let existing = [];

            if (
              fs.existsSync(
                CONTENT_FILE
              )
            ) {
              try {
                const raw =
                  fs.readFileSync(
                    CONTENT_FILE,
                    "utf8"
                  );

                if (
                  raw.trim()
                ) {
                  const parsed =
                    JSON.parse(
                      raw
                    );

                  if (
                    Array.isArray(
                      parsed
                    )
                  ) {
                    existing =
                      parsed;
                  } else if (
                    Array.isArray(
                      parsed.items
                    )
                  ) {
                    existing =
                      parsed.items;
                  }
                }
              } catch (error) {
                console.log(
                  "Existing JSON could not be parsed."
                );

                console.log(
                  "Continuing with an empty existing list."
                );
              }
            }

            /*
             * REMOVE EXACT DUPLICATE TITLES
             */

            const seenTitles =
              new Set();

            const newUnique =
              cleanItems.filter(
                item => {
                  const key =
                    item.title
                      .toLowerCase()
                      .replace(
                        /\s+/g,
                        " "
                      )
                      .trim();

                  if (
                    seenTitles.has(
                      key
                    )
                  ) {
                    return false;
                  }

                  seenTitles.add(
                    key
                  );

                  return true;
                }
              );

            /*
             * NEW CONTENT FIRST
             * OLD CONTENT AFTER THAT
             * MAXIMUM 300 ITEMS
             */

            const finalContent =
              [
                ...newUnique,
                ...existing
              ].slice(
                0,
                300
              );

            fs.writeFileSync(
              CONTENT_FILE,

              JSON.stringify(
                finalContent,
                null,
                2
              ),

              "utf8"
            );

            /*
             * SAVE A SMALL DAILY LOG
             */

            const logDir =
              "content/logs";

            fs.mkdirSync(
              logDir,
              {
                recursive: true
              }
            );

            const today =
              new Date()
                .toISOString()
                .slice(
                  0,
                  10
                );

            const logFile =
              `${logDir}/${today}.json`;

            fs.writeFileSync(
              logFile,

              JSON.stringify(
                {
                  generatedAt:
                    new Date()
                      .toISOString(),

                  newItems:
                    newUnique.length,

                  totalItems:
                    finalContent.length,

                  newsTopics:
                    news.length,

                  status:
                    "success"
                },
                null,
                2
              ),

              "utf8"
            );

            console.log("");
            console.log("================================");
            console.log("CONTENT GENERATION SUCCESS");
            console.log("================================");
            console.log(
              `Current news topics: ${news.length}`
            );
            console.log(
              `New content items: ${newUnique.length}`
            );
            console.log(
              `Total stored items: ${finalContent.length}`
            );
            console.log(
              `Saved to: ${CONTENT_FILE}`
            );
            console.log("");
          }

          main().catch(error => {
            console.error("");
            console.error(
              "================================"
            );
            console.error(
              "WORKFLOW SCRIPT FAILED"
            );
            console.error(
              "================================"
            );
            console.error(
              error
            );

            process.exit(1);
          });
          NODE

      - name: Commit and push generated content
        run: |
          git config user.name "GAMEZONE ARENA Auto Content"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/auto-content.json content/logs

          if git diff --cached --quiet; then
            echo "No content changes to commit."
            exit 0
          fi

          git commit -m "Generate daily Hindi GAMEZONE ARENA content"

          git push
