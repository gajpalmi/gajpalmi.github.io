name: name: GAMEZONE ARENA - Auto Content

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate content with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const API_KEY = process.env.GEMINI_API_KEY;

          if (!API_KEY) {
            console.error("GEMINI_API_KEY secret is missing.");
            process.exit(1);
          }

          const MODEL = "gemini-2.5-flash-lite";
          const URL =
            `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`;

          const prompt = `
          You are the automatic content writer for the GAMEZONE ARENA website.

          Generate 12 fresh, original website content items in English.

          IMPORTANT:
          - Do not copy copyrighted text.
          - Do not use quotations from famous people.
          - Do not create misleading facts.
          - Keep every item family-friendly and safe.
          - Make every item different from the others.
          - Return ONLY valid JSON matching the requested schema.
          - Do not use Markdown.
          - Content must be ready to display directly on a website.

          Use these exact type values:

          1. jokes
             Categories: Funny, Desi, Friendship, Family

          2. shayari
             Categories: Love, Friendship, Motivational, Life

          3. knowledge
             Categories: Science, Technology, India, Space, Animals

          4. entertainment
             Categories: Movies, Music, Games, Fun

          5. bhakti
             Categories: Prayer, Devotional, Spiritual, Festival

          6. blog
             Categories: Gaming, Technology, Lifestyle, Tips

          Generate a balanced mixture of these types.

          Each item must contain:
          - type
          - title
          - category
          - content

          The content should be useful, readable and suitable for the GAMEZONE ARENA website.
          `;

          const response = await fetch(URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-goog-api-key": API_KEY
            },
            body: JSON.stringify({
              contents: [
                {
                  parts: [
                    {
                      text: prompt
                    }
                  ]
                }
              ],
              generationConfig: {
                responseMimeType: "application/json",
                responseSchema: {
                  type: "ARRAY",
                  items: {
                    type: "OBJECT",
                    properties: {
                      type: {
                        type: "STRING"
                      },
                      title: {
                        type: "STRING"
                      },
                      category: {
                        type: "STRING"
                      },
                      content: {
                        type: "STRING"
                      }
                    },
                    required: [
                      "type",
                      "title",
                      "category",
                      "content"
                    ]
                  }
                },
                temperature: 0.9
              }
            })
          });

          const result = await response.json();

          if (!response.ok) {
            console.error("Gemini API request failed:");
            console.error(JSON.stringify(result, null, 2));
            process.exit(1);
          }

          const text =
            result?.candidates?.[0]?.content?.parts?.[0]?.text;

          if (!text) {
            console.error("Gemini returned no content.");
            console.error(JSON.stringify(result, null, 2));
            process.exit(1);
          }

          let newItems;

          try {
            newItems = JSON.parse(text);
          } catch (error) {
            console.error("Gemini returned invalid JSON.");
            console.error(text);
            process.exit(1);
          }

          if (!Array.isArray(newItems)) {
            console.error("Gemini response is not an array.");
            process.exit(1);
          }

          const allowedTypes = new Set([
            "jokes",
            "shayari",
            "knowledge",
            "entertainment",
            "bhakti",
            "blog"
          ]);

          const cleanItems = newItems
            .filter(item =>
              item &&
              allowedTypes.has(item.type) &&
              typeof item.title === "string" &&
              typeof item.category === "string" &&
              typeof item.content === "string"
            )
            .map(item => ({
              type: item.type,
              title: item.title.trim(),
              category: item.category.trim(),
              content: item.content.trim(),
              generatedAt: new Date().toISOString()
            }))
            .filter(item =>
              item.title &&
              item.content
            );

          if (cleanItems.length === 0) {
            console.error("No valid content items were generated.");
            process.exit(1);
          }

          const FILE = "content/auto-content.json";

          fs.mkdirSync("content", { recursive: true });

          let existingContent = [];

          if (fs.existsSync(FILE)) {
            try {
              const raw = fs.readFileSync(FILE, "utf8");

              if (raw.trim()) {
                const parsed = JSON.parse(raw);

                if (Array.isArray(parsed)) {
                  existingContent = parsed;
                }
              }
            } catch (error) {
              console.log(
                "Existing auto-content.json could not be read. Starting with an empty list."
              );
            }
          }

          const finalContent = [
            ...existingContent,
            ...cleanItems
          ];

          fs.writeFileSync(
            FILE,
            JSON.stringify(finalContent, null, 2),
            "utf8"
          );

          console.log(
            `Added ${cleanItems.length} new content items. Total: ${finalContent.length}`
          );
          NODE

      - name: Commit new content
        run: |
          git config user.name "GAMEZONE ARENA Auto Content"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/auto-content.json

          if git diff --cached --quiet; then
            echo "No content changes to commit."
            exit 0
          fi

          git commit -m "Auto generate daily website content"
          git push
