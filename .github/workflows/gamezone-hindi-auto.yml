name: GAMEZONE ARENA Daily Content

on:
  schedule:
    - cron: "45 3 * * *"

jobs:
  daily-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate daily content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const apiKey = process.env.GEMINI_API_KEY;

          if (!apiKey) {
            console.error("GEMINI_API_KEY is missing");
            process.exit(1);
          }

          async function main() {
            const prompt = `
Generate original Hindi content for GAMEZONE ARENA.

Return ONLY valid JSON.

Use exactly this structure:
{
  "jokes": [],
  "shayari": [],
  "bhakti": [],
  "knowledge": [],
  "technology": [],
  "gaming": [],
  "entertainment": [],
  "blog": []
}

Create 3 items in every category.

Rules:
- Write in natural Hindi.
- Content must be original.
- Do not copy articles.
- Do not invent news or quotes.
- Do not make political persuasion.
- Keep jokes clean.
- Keep knowledge useful and factual.
- Keep technology and gaming topics useful.
`;

            const response = await fetch(
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=" + apiKey,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  contents: [
                    {
                      parts: [
                        {
                          text: prompt
                        }
                      ]
                    }
                  ],
                  generationConfig: {
                    temperature: 0.8,
                    responseMimeType: "application/json"
                  }
                })
              }
            );

            if (!response.ok) {
              const errorText = await response.text();
              console.error(errorText);
              process.exit(1);
            }

            const data = await response.json();

            const text =
              data?.candidates?.[0]?.content?.parts?.[0]?.text;

            if (!text) {
              console.error("Gemini returned no content");
              process.exit(1);
            }

            const content = JSON.parse(text);

            fs.mkdirSync("content", { recursive: true });

            fs.writeFileSync(
              "content/auto-content.json",
              JSON.stringify(content, null, 2),
              "utf8"
            );

            console.log("GAMEZONE ARENA daily content generated successfully.");
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/auto-content.json
          git diff --cached --quiet || git commit -m "Update daily GAMEZONE ARENA content"
          git push
