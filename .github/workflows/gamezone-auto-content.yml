name: GAMEZONE ARENA Daily Hindi Content

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: gamezone-daily-content
  cancel-in-progress: false

jobs:
  generate-content:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate original Hindi AI content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const MODEL = "gemini-3.5-flash-lite";
          const OUTPUT = "content/auto-content.json";
          const MAX_STORED_ITEMS = 300;

          const CATEGORIES = [
            "Bhakti",
            "Bhajan",
            "Kirtan",
            "Shayari",
            "Dialogues",
            "Knowledge",
            "Blogs",
            "AI",
            "Jokes",
            "Gaming",
            "Vlogs"
          ];

          async function fetchNews() {
            const url =
              "https://news.google.com/rss?hl=hi&gl=IN&ceid=IN:hi";

            try {
              const response = await fetch(url, {
                headers: {
                  "User-Agent":
                    "GAMEZONE-ARENA-ContentBot/1.0"
                },
                signal: AbortSignal.timeout(12000)
              });

              if (!response.ok) {
                console.log("News feed unavailable.");
                return [];
              }

              const xml = await response.text();
              const blocks = [
                ...xml.matchAll(
                  /<item\b[^>]*>([\s\S]*?)<\/item>/gi
                )
              ];

              const results = [];
              const seen = new Set();
              const now = Date.now();
              const maxAge = 48 * 60 * 60 * 1000;

              function decode(s) {
                return String(s || "")
                  .replace(/<!\[CDATA\[/g, "")
                  .replace(/\]\]>/g, "")
                  .replace(/&amp;/g, "&")
                  .replace(/&quot;/g, '"')
                  .replace(/&#39;/g, "'")
                  .replace(/&apos;/g, "'")
                  .replace(/&lt;/g, "<")
                  .replace(/&gt;/g, ">")
                  .replace(/<[^>]*>/g, " ")
                  .replace(/\s+/g, " ")
                  .trim();
              }

              function tag(block, name) {
                const escaped = name.replace(
                  /[.*+?^${}()|[\]\\]/g,
                  "\\$&"
                );

                const match = block.match(
                  new RegExp(
                    "<" + escaped +
                    "(?:\\s[^>]*)?>([\\s\\S]*?)</" +
                    escaped + ">",
                    "i"
                  )
                );

                return match ? decode(match[1]) : "";
              }

              for (const match of blocks) {
                const block = match[1];
                const title = tag(block, "title");
                const description = tag(
                  block,
                  "description"
                );
                const link = tag(block, "link");
                const dateText = tag(block, "pubDate");
                const publisher = tag(block, "source");

                const timestamp = Date.parse(dateText);

                if (
                  !title ||
                  !description ||
                  !link ||
                  !publisher ||
                  !Number.isFinite(timestamp) ||
                  timestamp > now + 5 * 60 * 1000 ||
                  now - timestamp > maxAge
                ) {
                  continue;
                }

                let parsedUrl;

                try {
                  parsedUrl = new URL(link);
                } catch {
                  continue;
                }

                if (
                  !["http:", "https:"].includes(
                    parsedUrl.protocol
                  )
                ) {
                  continue;
                }

                const key = title
                  .toLowerCase()
                  .replace(/\s+/g, " ")
                  .trim();

                if (seen.has(key)) continue;
                seen.add(key);

                results.push({
                  title,
                  description,
                  publisher,
                  url: parsedUrl.href,
                  date: new Date(timestamp).toISOString()
                });

                // केवल थोड़े वर्तमान समाचार भेजें।
                if (results.length >= 5) break;
              }

              console.log(
                "Usable recent news sources:",
                results.length
              );

              return results;
            } catch (error) {
              console.log(
                "News unavailable; no news will be invented."
              );
              return [];
            }
          }

          async function generateWithAI(apiKey, prompt) {
            const endpoint =
              "https://generativelanguage.googleapis.com/v1beta/models/" +
              MODEL +
              ":generateContent";

            const response = await fetch(endpoint, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "x-goog-api-key": apiKey
              },
              body: JSON.stringify({
                contents: [
                  {
                    parts: [
                      { text: prompt }
                    ]
                  }
                ],
                generationConfig: {
                  temperature: 0.8,
                  responseMimeType: "application/json"
                }
              }),
              signal: AbortSignal.timeout(120000)
            });

            const body = await response.json();

            if (!response.ok) {
              throw new Error(
                "Gemini API HTTP " +
                response.status +
                ": " +
                JSON.stringify(body).slice(0, 1200)
              );
            }

            const text = body
              ?.candidates?.[0]
              ?.content?.parts
              ?.map(part => part.text || "")
              .join("");

            if (!text) {
              throw new Error(
                "Gemini returned no usable text."
              );
            }

            try {
              return JSON.parse(text);
            } catch {
              throw new Error(
                "Gemini returned invalid JSON."
              );
            }
          }

          function cleanString(value, maxLength = 12000) {
            return String(value || "")
              .replace(/\u0000/g, "")
              .trim()
              .slice(0, maxLength);
          }

          function normalizeTitle(title) {
            return cleanString(title, 300)
              .toLowerCase()
              .replace(/[^\p{L}\p{N}]+/gu, " ")
              .trim();
          }

          function isValidHttpUrl(value) {
            try {
              const u = new URL(value);
              return (
                u.protocol === "https:" ||
                u.protocol === "http:"
              );
            } catch {
              return false;
            }
          }

          async function main() {
            const apiKey = process.env.GEMINI_API_KEY;

            if (!apiKey) {
              throw new Error(
                "GEMINI_API_KEY is missing from GitHub Actions Secrets."
              );
            }

            fs.mkdirSync("content", { recursive: true });

            let existing = [];

            if (fs.existsSync(OUTPUT)) {
              try {
                const old = JSON.parse(
                  fs.readFileSync(OUTPUT, "utf8")
                );

                if (!Array.isArray(old)) {
                  throw new Error(
                    "Existing JSON is not an array."
                  );
                }

                existing = old;
              } catch (error) {
                // पुरानी फाइल को चुपचाप overwrite न करें।
                throw new Error(
                  "Existing auto-content.json is invalid; refusing to overwrite it. " +
                  error.message
                );
              }
            }

            const news = await fetchNews();

            const newsContext = news.length
              ? JSON.stringify(news, null, 2)
              : "NO VERIFIED RECENT NEWS SOURCES AVAILABLE.";

            const prompt = `
          आप GAMEZONE ARENA के हिंदी कंटेंट लेखक हैं।

          उद्देश्य:
          हर रन में वेबसाइट के लिए नई, उपयोगी, मौलिक हिंदी सामग्री बनाना।

          सभी 11 मुख्य कैटेगरी के लिए ठीक एक-एक नया आइटम बनाइए:
          ${CATEGORIES.join(", ")}

          कुल 11 मुख्य आइटम अनिवार्य हैं।
          इनके अतिरिक्त अधिकतम 1 समाचार आइटम बना सकते हैं,
          लेकिन केवल तभी जब नीचे दिए गए समाचार स्रोत में पर्याप्त
          जानकारी उपलब्ध हो।

          समाचार स्रोत:
          ${newsContext}

          महत्वपूर्ण सत्यता नियम:
          1. समाचार, तारीख, नाम, आँकड़े, बयान या घटना गढ़ना मना है।
          2. केवल ऊपर दिए गए स्रोत में स्पष्ट रूप से मौजूद तथ्यों का
             संक्षिप्त, मौलिक हिंदी सार लिखें।
          3. स्रोत का विवरण पर्याप्त न हो तो समाचार आइटम न बनाएँ।
          4. समाचार के लिए वास्तविक source URL, publisher और date
             दिए गए स्रोत से ही लें; अनुमान न लगाएँ।
          5. किसी RSS headline को स्वतंत्र रूप से सत्यापित समाचार न कहें।
          6. अफवाह, आरोप या अपुष्ट दावे को तथ्य की तरह न लिखें।
          7. समाचार न बन पाने पर भी सभी 11 गैर-समाचार कैटेगरी बनाएं।

          मौलिकता और कॉपीराइट:
          1. हर रचना नए शब्दों और अपनी मौलिक अभिव्यक्ति में लिखें।
          2. किसी वेबसाइट का लेख या उसका बड़ा हिस्सा कॉपी न करें।
          3. फिल्मों के प्रसिद्ध डायलॉग, गीतों के बोल या मौजूदा भजन
             की नकल न करें।
          4. किसी प्रसिद्ध लेखक, कवि या कलाकार की रचना को अपना
             बताकर प्रस्तुत न करें।
          5. मौलिकता का दावा सावधानी से करें; कॉपीराइट-मुक्त होने
             की कानूनी गारंटी न दें।

          कैटेगरी निर्देश:
          Bhakti: सम्मानजनक, सकारात्मक और मौलिक भक्ति विचार।
          Bhajan: नया भजन; किसी मौजूदा गीत के बोल नहीं।
          Kirtan: मौलिक कीर्तन या भक्ति-गायन रचना।
          Shayari: नई हिंदी शायरी।
          Dialogues: नए, मौलिक संवाद; फिल्म की नकल नहीं।
          Knowledge: उपयोगी और सही सामान्य जानकारी।
          Blogs: पाठक के काम आने वाला मौलिक लेख।
          AI: AI के उपयोग पर व्यावहारिक जानकारी; झूठे दावे नहीं।
          Jokes: नए, परिवार के साथ पढ़ने योग्य चुटकुले।
          Gaming: गेमिंग या लूडो के उपयोगी सुझाव; जीत की गारंटी नहीं।
          Vlogs: हिंदी व्लॉग के लिए नया विषय, रूपरेखा या स्क्रिप्ट।

          सभी गैर-समाचार आइटम:
          - सरल और स्वाभाविक हिंदी में हों।
          - केवल शीर्षक या दोहराए हुए वाक्य न हों।
          - विषय के अनुसार पर्याप्त उपयोगी सामग्री दें।
          - झूठे स्वास्थ्य, पैसे कमाने या निश्चित सफलता के दावे न करें।
          - किसी व्यक्ति के नाम पर नकली उद्धरण न बनाएँ।
          - एक ही विचार को अलग शीर्षक देकर दोबारा न दें।
          - त्योहार-विशेष सामग्री न बनाएँ।

          हर आइटम में ये JSON fields दें:
          type, category, title, content, keywords,
          sourceNote, sourceTitle, sourcePublisher, sourceUrl, sourceDate.

          category का मान इन नामों में से ही हो:
          ${CATEGORIES.join(", ")}, News

          सभी गैर-समाचार आइटम के लिए type = "item" रखें।
          समाचार के लिए भी type = "item" रखें ताकि वेबसाइट का
          मौजूदा JSON format बना रहे।

          गैर-समाचार आइटम के लिए:
          sourceNote = "Original AI-generated content"
          sourceTitle = ""
          sourcePublisher = "GAMEZONE ARENA"
          sourceUrl = ""
          sourceDate = ""

          समाचार के लिए sourceTitle, sourcePublisher, sourceUrl और
          sourceDate केवल दिए गए स्रोत से लें।

          केवल JSON लौटाएँ, इस प्रारूप में:
          {
            "items": [
              {
                "type": "item",
                "category": "Bhakti",
                "title": "शीर्षक",
                "content": "सामग्री",
                "keywords": ["हिंदी", "भक्ति"],
                "sourceNote": "Original AI-generated content",
                "sourceTitle": "",
                "sourcePublisher": "GAMEZONE ARENA",
                "sourceUrl": "",
                "sourceDate": ""
              }
            ]
          }
          `;

            console.log(
              "Generating original Hindi content with Gemini..."
            );

            const result = await generateWithAI(
              apiKey,
              prompt
            );

            if (!result || !Array.isArray(result.items)) {
              throw new Error(
                "AI response does not contain an items array."
              );
            }

            const allowed = new Set(CATEGORIES);
            allowed.add("News");

            const generated = result.items
              .filter(item =>
                item &&
                typeof item.title === "string" &&
                typeof item.content === "string"
              )
              .map(item => {
                const category = cleanString(
                  item.category,
                  40
                );

                const title = cleanString(
                  item.title,
                  300
                );

                const content = cleanString(
                  item.content,
                  12000
                );

                const isNews = category === "News";

                return {
                  type: "item",
                  category,
                  title,
                  content,
                  keywords: Array.isArray(item.keywords)
                    ? item.keywords
                        .map(x => cleanString(x, 80))
                        .filter(Boolean)
                        .slice(0, 8)
                    : [],
                  sourceNote: isNews
                    ? "Summary based on supplied news source; verify before relying on it."
                    : "Original AI-generated content",
                  sourceTitle: isNews
                    ? cleanString(item.sourceTitle, 300)
                    : "",
                  sourcePublisher: isNews
                    ? cleanString(item.sourcePublisher, 200)
                    : "GAMEZONE ARENA",
                  sourceUrl: isNews
                    ? cleanString(item.sourceUrl, 1000)
                    : "",
                  sourceDate: isNews
                    ? cleanString(item.sourceDate, 100)
                    : "",
                  generatedAt: new Date().toISOString()
                };
              })
              .filter(item =>
                allowed.has(item.category) &&
                item.title &&
                item.content
              );

            // सभी मुख्य कैटेगरी की मौजूदगी अनिवार्य है।
            for (const category of CATEGORIES) {
              const count = generated.filter(
                item => item.category === category
              ).length;

              if (count !== 1) {
                throw new Error(
                  `Expected exactly one ${category} item, received ${count}. No file was changed.`
                );
              }
            }

            // एक रन में अधिकतम एक समाचार।
            const newsItems = generated.filter(
              item => item.category === "News"
            );

            if (newsItems.length > 1) {
              throw new Error(
                "More than one news item was generated. No file was changed."
              );
            }

            // News तभी स्वीकार करें जब स्रोत RSS में मौजूद हो।
            if (newsItems.length === 1) {
              const item = newsItems[0];

              const matchingSource = news.find(source =>
                source.url === item.sourceUrl &&
                source.publisher === item.sourcePublisher &&
                source.title === item.sourceTitle
              );

              if (
                !matchingSource ||
                !isValidHttpUrl(item.sourceUrl) ||
                !item.sourceDate
              ) {
                throw new Error(
                  "News source could not be matched to a recent RSS item. No file was changed."
                );
              }
            }

            // एक ही नई सामग्री के दोहराव को रोकें।
            const newTitles = new Set();

            for (const item of generated) {
              const key = normalizeTitle(item.title);

              if (newTitles.has(key)) {
                throw new Error(
                  "Duplicate title detected in new content. No file was changed."
                );
              }

              newTitles.add(key);
            }

            // नई सामग्री पहले; पुरानी सामग्री बाद में।
            // मौजूदा JSON को array format में ही रखें।
            const combined = [...generated, ...existing];
            const finalItems = [];
            const seen = new Set();

            for (const item of combined) {
              if (
                !item ||
                typeof item.title !== "string" ||
                typeof item.content !== "string"
              ) {
                continue;
              }

              const titleKey = normalizeTitle(item.title);
              const categoryKey = cleanString(
                item.category,
                40
              ).toLowerCase();

              const key = categoryKey + "|" + titleKey;

              if (!titleKey || seen.has(key)) {
                continue;
              }

              seen.add(key);
              finalItems.push(item);

              if (finalItems.length >= MAX_STORED_ITEMS) {
                break;
              }
            }

            const tempFile = OUTPUT + ".tmp";

            fs.writeFileSync(
              tempFile,
              JSON.stringify(finalItems, null, 2) + "\n",
              "utf8"
            );

            // सेव करने से पहले JSON की जाँच।
            const checked = JSON.parse(
              fs.readFileSync(tempFile, "utf8")
            );

            if (!Array.isArray(checked)) {
              throw new Error(
                "JSON validation failed. Original file was not replaced."
              );
            }

            for (const category of CATEGORIES) {
              if (
                !generated.some(
                  item => item.category === category
                )
              ) {
                throw new Error(
                  "Missing category " + category
                );
              }
            }

            fs.renameSync(tempFile, OUTPUT);

            console.log(
              "New original items:",
              generated.length
            );
            console.log(
              "News items:",
              newsItems.length
            );
            console.log(
              "Total stored items:",
              finalItems.length
            );
            console.log("CONTENT GENERATION SUCCESS");
          }

          main().catch(error => {
            console.error("CONTENT GENERATION FAILED:");
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Validate content JSON
        run: |
          node <<'NODE'
          const fs = require("fs");

          const file = "content/auto-content.json";
          const data = JSON.parse(
            fs.readFileSync(file, "utf8")
          );

          if (!Array.isArray(data)) {
            throw new Error(
              "auto-content.json must be a JSON array."
            );
          }

          for (const item of data) {
            if (
              !item ||
              typeof item.title !== "string" ||
              typeof item.content !== "string" ||
              typeof item.category !== "string"
            ) {
              throw new Error(
                "Invalid item found in auto-content.json."
              );
            }
          }

          console.log(
            "JSON valid. Total items:",
            data.length
          );
          NODE

      - name: Commit generated content
        run: |
          git config user.name "GAMEZONE ARENA Auto Content"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/auto-content.json

          if git diff --cached --quiet; then
            echo "No content changes."
            exit 0
          fi

          git commit -m "Generate original Hindi AI content"
          git push origin HEAD:main
