name: GAMEZONE ARENA Daily Hindi Content

on:
  workflow_dispatch:
  schedule:
    - cron: "45 3 * * *"

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > generate.mjs <<'EOF'
          import fs from "fs";

          const API_KEY = process.env.GEMINI_API_KEY;

          if (!API_KEY) {
            throw new Error("GEMINI_API_KEY secret is missing.");
          }

          const NEWS_RSS =
            "https://news.google.com/rss?hl=hi&gl=IN&ceid=IN:hi";

          const SITE_URL =
            "https://gajpalmi.github.io";

          function cleanText(value) {
            return String(value ?? "").trim();
          }

          function decodeHtml(text) {
            return String(text)
              .replace(/<!\[CDATA\[(.*?)\]\]>/gs, "$1")
              .replace(/&amp;/g, "&")
              .replace(/&quot;/g, '"')
              .replace(/&#39;/g, "'")
              .replace(/&lt;/g, "<")
              .replace(/&gt;/g, ">");
          }

          function escapeHtml(value) {
            return String(value ?? "")
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&#039;");
          }

          function escapeXml(value) {
            return String(value ?? "")
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&apos;");
          }

          function slugify(text) {
            const value = cleanText(text);

            const slug = value
              .toLowerCase()
              .replace(/[^\p{L}\p{N}]+/gu, "-")
              .replace(/^-+|-+$/g, "")
              .slice(0, 80);

            return slug || "gamezone-arena-content";
          }

          async function getNews() {
            try {
              const response = await fetch(NEWS_RSS);

              if (!response.ok) {
                throw new Error(
                  `Google News HTTP ${response.status}`
                );
              }

              const xml = await response.text();

              const titles = [
                ...xml.matchAll(
                  /<title>(.*?)<\/title>/gis
                )
              ]
                .map((match) =>
                  decodeHtml(match[1]).trim()
                )
                .filter(Boolean)
                .slice(1, 16);

              console.log(
                `Found ${titles.length} news topics.`
              );

              return titles;
            } catch (error) {
              console.log(
                "News unavailable:",
                error.message
              );

              return [];
            }
          }

          async function askGemini(newsTitles) {
            const today =
              new Date().toISOString();

            const newsContext =
              newsTitles.length > 0
                ? newsTitles
                    .map(
                      (title, index) =>
                        `${index + 1}. ${title}`
                    )
                    .join("\n")
                : "कोई current headline उपलब्ध नहीं है।";

            const prompt = `
तुम GAMEZONE ARENA वेबसाइट के professional Hindi content editor हो।

आज की date/time:
${today}

Current Google News India Hindi topics:

${newsContext}

हर दिन लगभग 20 अलग-अलग नई सामग्री बनाओ।

मुख्य भाषा:
Hindi Devanagari.

जरूरत पड़ने पर common English technical terms रख सकते हो।

किसी दूसरी वेबसाइट का article copy नहीं करना है।

Google News headlines को केवल topic idea की तरह इस्तेमाल करना है।

Headline में जो जानकारी उपलब्ध नहीं है उसे invent नहीं करना है।

Current news में केवल उपलब्ध जानकारी के आधार पर सावधानी से लिखना है।

इन topics को मिलाकर content बनाओ:

jokes
shayari
bhakti
bhajan
kirtan
knowledge
facts
motivation
technology
mobile
Android
Google
internet
AI
gaming
apps
social-media
entertainment
cricket
sports
education
health-and-lifestyle
tips
how-to
blogging
digital
cybersecurity-awareness
current-news
trending-topics
dialogue
family
festival
interesting-facts

Search-friendly topics भी शामिल करो:

मोबाइल में कैसे करें
Android में कैसे करें
Google में कैसे करें
AI कैसे इस्तेमाल करें
AI tools
Internet tips
Mobile tips
Android tips
Google tips
Gaming tips
Blogging tips
Online safety
Digital safety
Technology explainers
Apps की जानकारी
YouTube basics
Social media tips

Health content में केवल general educational information देना है।
Personal diagnosis या personal medical advice नहीं देना है।

Cybersecurity content awareness और safety education पर आधारित होना चाहिए।

हर item में exactly ये fields रखो:

type
category
title
slug
excerpt
content
readMoreContent
keywords
seoTitle
metaDescription
sourceNote
datePublished

Rules:

title छोटा और साफ हो।

excerpt 1-2 lines का हो।

content छोटा मुख्य article हो।

readMoreContent पूरा detailed article हो।

Read More article में जरूरत के अनुसार:
परिचय
मुख्य जानकारी
आसान explanation
examples
practical tips
सावधानियाँ
conclusion

keywords में 5-10 natural search phrases हों।

seoTitle लगभग 50-60 characters का हो।

metaDescription लगभग 120-160 characters की हो।

Evergreen content के लिए sourceNote:
मौलिक सामग्री

Current topic के लिए sourceNote:
Google News India के current topic से प्रेरित

Jokes original हों।
Shayari original हो।
Bhakti content original हो।
Bhajan/kirtan content original हो।
Knowledge useful हो।
Technology practical हो।
Mobile और Android tips practical हों।
AI content beginner-friendly हो।
Gaming content useful हो।
Blogging content useful हो।

एक ही topic को repeat मत करो।

Clickbait मत बनाओ।

झूठे claims मत बनाओ।

अंत में केवल valid JSON array दो।

Markdown मत दो।
```json मत दो।
कोई extra explanation मत दो।
`;

            const url =
              "https://generativelanguage.googleapis.com/v1beta/models/" +
              "gemini-3.5-flash-lite:generateContent?key=" +
              encodeURIComponent(API_KEY);

            const response = await fetch(url, {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json"
              },
              body: JSON.stringify({
                contents: [
                  {
                    parts: [
                      {
                        text: prompt
                      }
                    ]
                  }
                ],
                generationConfig: {
                  temperature: 0.8,
                  maxOutputTokens: 20000,
                  responseMimeType:
                    "application/json"
                }
              })
            });

            const raw =
              await response.text();

            if (!response.ok) {
              throw new Error(
                `Gemini API ${response.status}: ${raw}`
              );
            }

            const data =
              JSON.parse(raw);

            const text =
              data?.candidates?.[0]?.content?.parts
                ?.map(
                  (part) =>
                    part.text || ""
                )
                .join("")
                .trim();

            if (!text) {
              throw new Error(
                "Gemini returned empty content."
              );
            }

            const cleaned =
              text
                .replace(
                  /^```json\s*/i,
                  ""
                )
                .replace(
                  /^```\s*/i,
                  ""
                )
                .replace(
                  /\s*```$/i,
                  ""
                )
                .trim();

            const result =
              JSON.parse(cleaned);

            if (
              !Array.isArray(result)
            ) {
              throw new Error(
                "Gemini did not return a JSON array."
              );
            }

            return result;
          }

          function makeArticle(item) {
            const articleUrl =
              `${SITE_URL}/articles/${item.slug}/`;

            const jsonLd = {
              "@context":
                "https://schema.org",
              "@type":
                item.type === "current-news"
                  ? "NewsArticle"
                  : "BlogPosting",
              "headline":
                item.title,
              "description":
                item.metaDescription,
              "datePublished":
                item.datePublished,
              "dateModified":
                item.datePublished,
              "inLanguage":
                "hi-IN",
              "author": {
                "@type":
                  "Organization",
                "name":
                  "GAMEZONE ARENA"
              },
              "mainEntityOfPage": {
                "@type":
                  "WebPage",
                "@id":
                  articleUrl
              }
            };

            return `<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>${escapeHtml(item.seoTitle)}</title>

<meta
  name="description"
  content="${escapeHtml(item.metaDescription)}"
>

<meta
  name="robots"
  content="index,follow"
>

<link
  rel="canonical"
  href="${escapeHtml(articleUrl)}"
>

<script type="application/ld+json">
${JSON.stringify(jsonLd, null, 2)}
</script>

<style>
body {
  margin: 0;
  padding: 0;
  background: #0b0f14;
  color: #ffffff;
  font-family: Arial, sans-serif;
  line-height: 1.8;
}

article {
  max-width: 850px;
  margin: auto;
  padding: 24px;
}

h1 {
  line-height: 1.4;
}

.meta {
  opacity: 0.7;
  font-size: 14px;
  margin-bottom: 20px;
}

.excerpt {
  font-size: 18px;
  margin: 20px 0;
}

.content {
  white-space: pre-wrap;
  font-size: 17px;
}

a {
  color: #5de6ff;
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

hr {
  margin: 35px 0;
  opacity: 0.2;
}
</style>
</head>

<body>

<article>

<p>
<a href="${SITE_URL}/">
← GAMEZONE ARENA पर वापस जाएँ
</a>
</p>

<h1>${escapeHtml(item.title)}</h1>

<div class="meta">
${escapeHtml(item.category)}
·
${escapeHtml(item.datePublished)}
</div>

<div class="excerpt">
${escapeHtml(item.excerpt)}
</div>

<div class="content">
${escapeHtml(item.readMoreContent)}
</div>

<hr>

<p>
${escapeHtml(item.sourceNote)}
</p>

<p>
© GAMEZONE ARENA
</p>

</article>

</body>
</html>`;
          }

          async function main() {
            const news =
              await getNews();

            const generated =
              await askGemini(news);

            const now =
              new Date();

            const newItems =
              generated
                .slice(0, 20)
                .map(
                  (item, index) => {
                    const title =
                      cleanText(
                        item?.title
                      ) ||
                      `GAMEZONE ARENA Content ${index + 1}`;

                    const content =
                      cleanText(
                        item?.content
                      );

                    const readMore =
                      cleanText(
                        item?.readMoreContent
                      ) ||
                      content;

                    return {
                      type:
                        cleanText(
                          item?.type
                        ) ||
                        "knowledge",

                      category:
                        cleanText(
                          item?.category
                        ) ||
                        "Hindi",

                      title,

                      slug:
                        `${slugify(
                          item?.slug ||
                          title
                        )}-${now.getTime()}-${index + 1}`,

                      excerpt:
                        cleanText(
                          item?.excerpt
                        ),

                      content,

                      readMoreContent:
                        readMore,

                      keywords:
                        Array.isArray(
                          item?.keywords
                        )
                          ? item.keywords
                              .map(
                                (x) =>
                                  cleanText(x)
                              )
                              .filter(Boolean)
                              .slice(0, 10)
                          : [],

                      seoTitle:
                        cleanText(
                          item?.seoTitle
                        ) ||
                        title,

                      metaDescription:
                        cleanText(
                          item?.metaDescription
                        ) ||
                        cleanText(
                          item?.excerpt
                        ) ||
                        title,

                      sourceNote:
                        cleanText(
                          item?.sourceNote
                        ) ||
                        "मौलिक सामग्री",

                      datePublished:
                        now.toISOString()
                    };
                  }
                );

            if (
              newItems.length === 0
            ) {
              throw new Error(
                "No content generated."
              );
            }

            fs.mkdirSync(
              "content",
              {
                recursive: true
              }
            );

            const file =
              "content/auto-content.json";

            let oldItems = [];

            if (
              fs.existsSync(file)
            ) {
              try {
                const old =
                  JSON.parse(
                    fs.readFileSync(
                      file,
                      "utf8"
                    )
                  );

                if (
                  Array.isArray(old)
                ) {
                  oldItems = old;
                } else if (
                  Array.isArray(
                    old?.items
                  )
                ) {
                  oldItems =
                    old.items;
                }
              } catch {
                oldItems = [];
              }
            }

            const allItems = [
              ...newItems,
              ...oldItems
            ].slice(0, 300);

            fs.writeFileSync(
              file,
              JSON.stringify(
                {
                  generatedAt:
                    now.toISOString(),
                  count:
                    allItems.length,
                  items:
                    allItems
                },
                null,
                2
              )
            );

            console.log(
              `Saved ${allItems.length} total content items.`
            );

            fs.mkdirSync(
              "articles",
              {
                recursive: true
              }
            );

            const urls = [];

            for (
              const item of newItems
            ) {
              const directory =
                `articles/${item.slug}`;

              fs.mkdirSync(
                directory,
                {
                  recursive: true
                }
              );

              const url =
                `${SITE_URL}/articles/${item.slug}/`;

              urls.push(url);

              fs.writeFileSync(
                `${directory}/index.html`,
                makeArticle(item)
              );
            }

            const sitemapUrls = [
              `${SITE_URL}/`,
              ...urls
            ];

            const sitemap =
              `<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
${sitemapUrls
  .map(
    (url) =>
      `<url>
<loc>${escapeXml(url)}</loc>
<lastmod>${now.toISOString()}</lastmod>
</url>`
  )
  .join("\n")}
</urlset>`;

            fs.writeFileSync(
              "sitemap.xml",
              sitemap
            );

            fs.writeFileSync(
              "robots.txt",
              `User-agent: *
Allow: /

Sitemap: ${SITE_URL}/sitemap.xml
`
            );

            console.log(
              `Created ${urls.length} article pages.`
            );

            console.log(
              "Daily content generation completed."
            );
          }

          main().catch(
            (error) => {
              console.error(
                "WORKFLOW ERROR:"
              );
              console.error(error);
              process.exit(1);
            }
          );
          EOF

          node generate.mjs

      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/auto-content.json
          git add articles
          git add sitemap.xml
          git add robots.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "auto: daily Hindi content update"

          git push
