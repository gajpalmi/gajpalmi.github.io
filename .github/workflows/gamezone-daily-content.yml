name: GAMEZONE ARENA Daily Hindi Content

"on":
  workflow_dispatch:
  schedule:
    - cron: "45 3 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import re
          import html
          import urllib.request
          from datetime import datetime, timezone

          KEY = os.environ.get("GEMINI_API_KEY")
          if not KEY:
              raise SystemExit("GEMINI_API_KEY secret missing")

          MODEL = "gemini-3.5-flash-lite"
          API = "https://generativelanguage.googleapis.com/v1beta/models/" + MODEL + ":generateContent"
          RSS = "https://news.google.com/rss?hl=hi&gl=IN&ceid=IN:hi"
          FILE = "content/auto-content.json"
          LOG = "content/logs"

          def clean(x):
              x = html.unescape(str(x or ""))
              x = re.sub(r"<[^>]+>", " ", x)
              x = re.sub(r"\s+", " ", x)
              return x.strip()

          def get_news():
              try:
                  req = urllib.request.Request(
                      RSS,
                      headers={"User-Agent": "GAMEZONE-ARENA/1.0"}
                  )
                  data = urllib.request.urlopen(req, timeout=20).read().decode("utf-8")
                  result = []

                  for block in re.findall(r"<item>(.*?)</item>", data, re.S)[:15]:
                      m = re.search(r"<title>(.*?)</title>", block, re.S)
                      u = re.search(r"<link>(.*?)</link>", block, re.S)

                      if not m:
                          continue

                      title = clean(m.group(1))
                      link = clean(u.group(1)) if u else ""

                      if title and title.lower() not in [x["title"].lower() for x in result]:
                          result.append({
                              "title": title,
                              "link": link
                          })

                  return result

              except Exception as e:
                  print("News unavailable:", e)
                  return []

          news = get_news()

          news_text = "\n".join(
              "- " + x["title"] + " | " + x["link"]
              for x in news
          )

          prompt = """
आप GAMEZONE ARENA वेबसाइट के automatic Hindi content editor हैं।

20 अलग-अलग COMPLETE सामग्री तैयार करें।

मुख्य भाषा सरल हिंदी देवनागरी हो।

विषयों में variety रखें:

हिंदी चुटकुले
मजेदार संवाद
सुविचार
Motivation
प्रेम शायरी
दोस्ती शायरी
जीवन शायरी
भक्ति
भजन
कीर्तन
आध्यात्मिक जानकारी
ज्ञान
सामान्य ज्ञान
Current News
Current Trends
Mobile
Android
Internet
Online Safety
AI
Google
Technology
Apps
Gadgets
Gaming
Ludo
Cricket Gaming
Gaming Tips
Blogging
SEO
Website
How-To
Entertainment

हर content पूरा और पढ़ने योग्य हो।

सिर्फ headline या अधूरा paragraph नहीं।

Jokes लगभग 80-160 शब्द।
Dialogue लगभग 100-200 शब्द।
Bhakti/Bhajan/Kirtan लगभग 150-350 शब्द।
Knowledge लगभग 220-400 शब्द।
Technology/Mobile/AI/Internet/Gaming लगभग 250-500 शब्द।
Blog/SEO/Website/How-To लगभग 300-600 शब्द।

Current News के लिए केवल उपलब्ध news topics का उपयोग करें।
कोई fake fact, fake number, fake quote, fake date या fake allegation नहीं।

Political विषय आने पर neutral factual भाषा रखें।
किसी party/candidate के पक्ष या विरोध में persuasion नहीं।
Winner/best/worst/ranking नहीं।
Motive speculation नहीं।

Health और finance में guaranteed cure, guaranteed income,
guaranteed return या unsafe advice नहीं।

Original jokes, shayari, dialogue और devotional content दें।
Copyrighted भजन के पूरे lyrics copy न करें।
Famous व्यक्ति के नाम से fake quote न बनाएं।

हर item में ये fields हों:

type
title
category
content
keywords
seoTitle
metaDescription
sourceNote
sourceUrl

keywords 3-8 रखें।
metaDescription 160 characters से कम रखें।

Current news/trends:
sourceNote = Google News India के current topic से प्रेरित

Original:
sourceNote = मौलिक सामग्री

पूरा content content field में दें।

केवल JSON object दें।
"""

          prompt += "\n\nCURRENT GOOGLE NEWS INDIA:\n" + (
              news_text if news_text else
              "आज current news उपलब्ध नहीं है। News invent न करें।"
          )

          body = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.75,
                  "responseMimeType": "application/json"
              }
          }

          req = urllib.request.Request(
              API,
              data=json.dumps(body, ensure_ascii=False).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": KEY
              },
              method="POST"
          )

          try:
              response = urllib.request.urlopen(req, timeout=180)
              result = json.loads(response.read().decode("utf-8"))
          except Exception as e:
              raise SystemExit("Gemini API error: " + str(e))

          try:
              text = result["candidates"][0]["content"]["parts"][0]["text"]
              data = json.loads(text)
              items = data.get("items", [])
          except Exception:
              raise SystemExit("Gemini returned invalid JSON/content")

          if not isinstance(items, list):
              raise SystemExit("Invalid items response")

          new_items = []

          aliases = {
              "joke": "jokes",
              "poetry": "shayari",
              "poem": "shayari",
              "dialogues": "dialogue",
              "gk": "knowledge",
              "trend": "trends",
              "trending": "trends",
              "android": "mobile",
              "tech": "technology",
              "app": "apps",
              "gadget": "gadgets",
              "game": "gaming",
              "ludo": "gaming",
              "howto": "tips",
              "how-to": "tips",
              "blogs": "blog"
          }

          for item in items[:20]:
              if not isinstance(item, dict):
                  continue

              title = clean(item.get("title"))
              content = clean(item.get("content"))

              if not title or len(content) < 120:
                  continue

              typ = clean(item.get("type")).lower()
              typ = aliases.get(typ, typ)

              new_items.append({
                  "type": typ or "blog",
                  "title": title,
                  "category": clean(item.get("category")) or "General",
                  "content": content,
                  "keywords": [
                      clean(x)
                      for x in item.get("keywords", [])
                      if clean(x)
                  ][:8],
                  "seoTitle": clean(item.get("seoTitle")) or title,
                  "metaDescription": clean(
                      item.get("metaDescription")
                  )[:160],
                  "sourceNote": clean(
                      item.get("sourceNote")
                  ) or "मौलिक सामग्री",
                  "sourceUrl": clean(
                      item.get("sourceUrl")
                  ),
                  "generatedAt": datetime.now(
                      timezone.utc
                  ).isoformat()
              })

          if len(new_items) < 20:
              raise SystemExit(
                  "Incomplete content: only "
                  + str(len(new_items))
                  + " complete items generated"
              )

          try:
              with open(FILE, "r", encoding="utf-8") as f:
                  old = json.load(f)
          except Exception:
              old = []

          if not isinstance(old, list):
              old = []

          final = []
          seen = set()

          for item in new_items + old:
              key = clean(item.get("title")).lower()

              if not key or key in seen:
                  continue

              seen.add(key)
              final.append(item)

              if len(final) >= 300:
                  break

          os.makedirs("content", exist_ok=True)

          with open(FILE, "w", encoding="utf-8") as f:
              json.dump(
                  final,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          os.makedirs(LOG, exist_ok=True)

          today = datetime.now(
              timezone.utc
          ).strftime("%Y-%m-%d")

          with open(
              LOG + "/" + today + ".json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  {
                      "status": "success",
                      "model": MODEL,
                      "newsTopics": len(news),
                      "newItems": len(new_items),
                      "totalStored": len(final),
                      "generatedAt": datetime.now(
                          timezone.utc
                      ).isoformat()
                  },
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("================================")
          print("GAMEZONE ARENA CONTENT SUCCESS")
          print("News topics:", len(news))
          print("New items:", len(new_items))
          print("Total stored:", len(final))
          print("================================")
          PY

      - name: Commit content
        run: |
          git config user.name "GAMEZONE ARENA Auto Content"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/auto-content.json content/logs

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Daily Hindi GAMEZONE ARENA content"
          git push
