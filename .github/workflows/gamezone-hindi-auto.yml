name: GAMEZONE ARENA Daily Hindi Content

"on":
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Hindi content with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node <<'NODE'
          async function main() {
            const apiKey = process.env.GEMINI_API_KEY;

            if (!apiKey) {
              throw new Error("GEMINI_API_KEY is missing");
            }

            const prompt = `
Generate original Hindi content for GAMEZONE ARENA.

Return ONLY valid JSON.

Create exactly 18 items with these categories:
jokes
shayari
bhakti
knowledge
technology
gaming
entertainment
blog
news

Rules:
- Natural Hindi.
- Original content only.
- Do not copy from websites.
- Do not invent facts, quotes, news, names, dates or statistics.
- News must be based only on information available to you.
- No political persuasion.
- Jokes must be clean.
- Bhakti content must be respectful.
- Knowledge must be useful and factual.
- Technology and gaming content should be useful for users.
- Blogs should contain useful information, not only headlines.

Return this exact JSON structure:

{
  "jokes": [],
  "shayari": [],
  "bhakti": [],
  "knowledge": [],
  "technology": [],
  "gaming": [],
  "entertainment": [],
  "blog": [],
  "news": []
}
`;

            const response = await fetch(
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=" + apiKey,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  contents: [
                    {
                      parts: [
                        {
                          text: prompt
                        }
                      ]
                    }
                  ],
                  tools: [
                    {
                      google_search: {}
                    }
                  ],
                  generationConfig: {
                    temperature: 0.8,
                    responseMimeType: "application/json"
                  }
                })
              }
            );

            const result = await response.text();

            if (!response.ok) {
              throw new Error(result);
            }

            const data = JSON.parse(result);

            const text =
              data?.candidates?.[0]?.content?.parts?.[0]?.text;

            if (!text) {
              throw new Error("Gemini returned no content");
            }

            const content = JSON.parse(text);

            const fs = require("fs");

            fs.mkdirSync("content", { recursive: true });

            fs.writeFileSync(
              "content/auto-content.json",
              JSON.stringify(content, null, 2),
              "utf8"
            );

            console.log("GAMEZONE ARENA Hindi content generated successfully.");
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/auto-content.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update GAMEZONE ARENA Hindi content"
            git push
          fi
