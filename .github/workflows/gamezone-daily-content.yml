name: GAMEZONE ARENA Daily Hindi Content

"on":
  workflow_dispatch:

  schedule:
    - cron: "45 3 * * *"

permissions:
  contents: write

concurrency:
  group: gamezone-arena-daily-content
  cancel-in-progress: false

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Hindi content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 <<'PY'
          import os
          import json
          import re
          import html
          import urllib.request
          from datetime import datetime, timezone

          KEY = os.environ.get("GEMINI_API_KEY")
          if not KEY:
              raise SystemExit("GEMINI_API_KEY secret missing")

          MODEL = "gemini-3.5-flash-lite"
          API = "https://generativelanguage.googleapis.com/v1beta/models/" + MODEL + ":generateContent"
          RSS = "https://news.google.com/rss?hl=hi&gl=IN&ceid=IN:hi"
          FILE = "content/auto-content.json"
          LOGDIR = "content/logs"

          def clean(x):
              x = html.unescape(str(x or ""))
              x = re.sub(r"<!\[CDATA\[(.*?)\]\]>", r"\1", x, flags=re.S)
              x = re.sub(r"<[^>]+>", " ", x)
              return re.sub(r"\s+", " ", x).strip()

          def news():
              try:
                  req = urllib.request.Request(
                      RSS,
                      headers={"User-Agent": "GAMEZONE-ARENA-Auto-Content/1.0"}
                  )
                  xml = urllib.request.urlopen(req, timeout=20).read().decode("utf-8")
                  out = []
                  for block in re.findall(r"<item>(.*?)</item>", xml, re.S)[:15]:
                      m = re.search(r"<title>(.*?)</title>", block, re.S)
                      l = re.search(r"<link>(.*?)</link>", block, re.S)
                      if m:
                          title = clean(m.group(1))
                          if title and title.lower() not in [x["title"].lower() for x in out]:
                              out.append({
                                  "title": title,
                                  "link": clean(l.group(1)) if l else ""
                              })
                  return out
              except Exception as e:
                  print("News RSS unavailable:", e)
                  return []

          topics = news()

          topic_text = "\n".join(
              f"- {x['title']} | {x['link']}"
              for x in topics
          )

          prompt = f"""
आप GAMEZONE ARENA वेबसाइट के automatic Hindi editor हैं।

EXACTLY 20 अलग-अलग COMPLETE items बनाइए।

सभी user-facing सामग्री सरल हिंदी देवनागरी में हो।
Technical terms जरूरत के अनुसार English में रह सकते हैं।

CURRENT GOOGLE NEWS INDIA TOPICS:
{topic_text or "कोई current news उपलब्ध नहीं है। Current news invent न करें।"}

इन सभी विषयों में अच्छी variety रखें:
चुटकुले, मजेदार संवाद, सुविचार, motivation,
प्रेम शायरी, दोस्ती शायरी, जीवन शायरी,
भक्ति, भजन, कीर्तन, आध्यात्मिक जानकारी,
ज्ञान, सामान्य ज्ञान, current news, trends,
mobile, Android, internet, online safety,
AI, Google, technology, apps, gadgets,
gaming, Ludo, cricket gaming, gaming tips,
blogging, SEO, website, how-to और entertainment।

हर item COMPLETE होना चाहिए।
सिर्फ headline, teaser, अधूरा paragraph या placeholder नहीं।

लगभग ये minimum रखें:
Jokes: 80-160 शब्द
Dialogue: 100-200 शब्द
Bhakti/Bhajan/Kirtan: 150-350 शब्द
Knowledge: 220-400 शब्द
Technology/Mobile/AI/Internet/Gaming: 250-500 शब्द
Blog/SEO/Website/How-To: 300-600 शब्द

Current news के लिए केवल दिए गए source topics का उपयोग करें।
Source में जो नहीं है उसे fact की तरह invent न करें।
Fake names, fake numbers, fake quotes, fake dates और fake allegations नहीं।

Political topic हो तो neutral factual भाषा रखें।
किसी party/candidate के पक्ष या विरोध में persuasion,
ranking, winner/best/worst, motive speculation नहीं।

Health या finance में diagnosis, guaranteed cure,
guaranteed income/return या unsafe advice नहीं।

Original jokes, shayari, dialogue और devotional content दें।
Copyrighted भजन के पूरे lyrics copy न करें।
किसी famous व्यक्ति के नाम से fake quote न बनाएं।

हर item में ये fields अनिवार्य हैं:
type
title
category
content
keywords
seoTitle
metaDescription
sourceNote
sourceUrl

keywords 3-8 रखें।
metaDescription 160 characters से कम रखें।

Current news/trends के लिए sourceNote:
Google News India के current topic से प्रेरित

बाकी original content के लिए:
मौलिक सामग्री

Allowed type:
jokes, shayari, suvichar, motivation, dialogue,
bhakti, bhajan, kirtan, knowledge, news, trends,
mobile, internet, ai, google, technology, apps,
gadgets, gaming, entertainment, tips, blog, seo, website

कोई "Read More के लिए बाकी पढ़ें" जैसा अधूरा content नहीं।
पूरा article content field में ही होना चाहिए।

केवल JSON object दें:
{{
  "items": [
    {{
      "type": "jokes",
      "title": "शीर्षक",
      "category": "Funny",
      "content": "पूरा content",
      "keywords": ["हिंदी", "चुटकुले", "मजेदार"],
      "seoTitle": "SEO title",
      "metaDescription": "SEO description",
      "sourceNote": "मौलिक सामग्री",
      "sourceUrl": ""
    }}
  ]
}}
"""

          body = {
              "contents": [
                  {
                      "parts": [
                          {"text": prompt}
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.75,
                  "responseMimeType": "application/json"
              }
          }

          req = urllib.request.Request(
              API,
              data=json.dumps(body, ensure_ascii=False).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": KEY
              },
              method="POST"
          )

          with urllib.request.urlopen(req, timeout=180) as r:
              result = json.loads(r.read().decode("utf-8"))

          text = result["candidates"][0]["content"]["parts"][0]["text"]
          data = json.loads(text)
          generated = data.get("items", [])

          if len(generated) < 20:
              raise SystemExit(
                  f"Incomplete Gemini response: {len(generated)}/20 items"
              )

          def norm_type(x):
              x = clean(x).lower()
              aliases = {
                  "joke": "jokes",
                  "jokes": "jokes",
                  "poetry": "shayari",
                  "poem": "shayari",
                  "shayari": "shayari",
                  "dialogues": "dialogue",
                  "dialogue": "dialogue",
                  "suvichar": "suvichar",
                  "motivation": "motivation",
                  "bhakti": "bhakti",
                  "bhajan": "bhajan",
                  "kirtan": "kirtan",
                  "gk": "knowledge",
                  "knowledge": "knowledge",
                  "news": "news",
                  "trend": "trends",
                  "trending": "trends",
                  "trends": "trends",
                  "android": "mobile",
                  "mobile": "mobile",
                  "internet": "internet",
                  "ai": "ai",
                  "google": "google",
                  "tech": "technology",
                  "technology": "technology",
                  "app": "apps",
                  "apps": "apps",
                  "gadget": "gadgets",
                  "gadgets": "gadgets",
                  "game": "gaming",
                  "gaming": "gaming",
                  "ludo": "gaming",
                  "entertainment": "entertainment",
                  "tips": "tips",
                  "how-to": "tips",
                  "howto": "tips",
                  "blog": "blog",
                  "blogs": "blog",
                  "seo": "seo",
                  "website": "website"
              }
              return aliases.get(x, "blog")

          now = datetime.now(timezone.utc).isoformat()
          new = []

          for item in generated[:20]:
              if not isinstance(item, dict):
                  continue

              title = clean(item.get("title"))
              content = clean(item.get("content"))

              if not title or len(content) < 120:
                  continue

              keywords = item.get("keywords", [])
              if not isinstance(keywords, list):
                  keywords = []

              new.append({
                  "type": norm_type(item.get("type")),
                  "title": title,
                  "category": clean(item.get("category")) or "General",
                  "content": content,
                  "keywords": [clean(x) for x in keywords[:8] if clean(x)],
                  "seoTitle": clean(item.get("seoTitle")) or title,
                  "metaDescription": clean(item.get("metaDescription"))[:160],
                  "sourceNote": clean(item.get("sourceNote")) or "मौलिक सामग्री",
                  "sourceUrl": clean(item.get("sourceUrl")),
                  "generatedAt": now
              })

          if len(new) < 20:
              raise SystemExit(
                  f"Only {len(new)} complete items remained after validation"
              )

          try:
              with open(FILE, "r", encoding="utf-8") as f:
                  old = json.load(f)
          except Exception:
              old = []

          if not isinstance(old, list):
              old = []

          seen = set()
          final = []

          for item in new + old:
              key = clean(item.get("title")).lower()
              if not key or key in seen:
                  continue
              seen.add(key)
              final.append(item)
              if len(final) >= 300:
                  break

          os.makedirs("content", exist_ok=True)
          with open(FILE, "w", encoding="utf-8") as f:
              json.dump(final, f, ensure_ascii=False, indent=2)

          os.makedirs(LOGDIR, exist_ok=True)
          today = datetime.now(timezone.utc).strftime("%Y-%m-%d")

          with open(f"{LOGDIR}/{today}.json", "w", encoding="utf-8") as f:
              json.dump({
                  "status": "success",
                  "generatedAt": now,
                  "model": MODEL,
                  "newsTopics": len(topics),
                  "newItems": len(new),
                  "totalStored": len(final)
              }, f, ensure_ascii=False, indent=2)

          print("SUCCESS")
          print("News topics:", len(topics))
          print("New complete items:", len(new))
          print("Total stored:", len(final))
          PY

      - name: Commit generated content
        run: |
          git config user.name "GAMEZONE ARENA Auto Content"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/auto-content.json content/logs

          if git diff --cached --quiet; then
            echo "No content changes."
            exit 0
          fi

          git commit -m "Generate daily Hindi GAMEZONE ARENA content"
          git push
